    const medicoes = ativ.params.map((pid) => {
      const p = PARAMS[pid];
      let valor = Number((p.ideal + rf(-p.drift * 4, p.drift * 4)).toFixed(p.dec));
      if (cfg.medicaoFora === pid) valor = Number((p.max + rf(1, 5)).toFixed(p.dec));
      valor = Math.max(p.scaleMin, Math.min(p.scaleMax, valor));
      return {
        id: `MED-${pets.length}-${pid}`, param: pid, valor,
        ts: criadaEm + ri(6, 16) * MIN, byId: responsavel,
        status: classify(pid, valor),
      };
    });

    const riscos = cfg.riscos ?? ativ.riscos.slice(0, ri(3, ativ.riscos.length));
    const medidas = riscos.flatMap((r) => RISCOS[r]?.medidas ?? []).slice(0, 6);
    const epis = ativ.epis;
    const equipamentos = rpn(EQUIPAMENTOS, ri(2, 4));
    const ferramentas = rpn(FERRAMENTAS, ri(2, 3));

    const done = ['LIBERADA', 'ATIVA', 'ENCERRADA', 'SUSPENSA'].includes(cfg.status);
    const checklist = {};
    CHECKLIST.forEach((c, idx) => {
      const ok = done || (cfg.status === 'EM_VALIDACAO' ? idx < (cfg.checkDone ?? 5) : false);
      checklist[c.id] = ok ? { ok: true, byId: responsavel, ts: criadaEm + (18 + idx) * MIN } : { ok: false };
    });

    const validadaEm = done ? criadaEm + ri(22, 46) * MIN : null;
    const liberadaEm = done ? validadaEm + ri(3, 9) * MIN : null;
    const iniciadaEm = ['ATIVA', 'ENCERRADA', 'SUSPENSA'].includes(cfg.status) ? liberadaEm + ri(4, 14) * MIN : null;
    const encerradaEm = cfg.status === 'ENCERRADA' ? (cfg.encerradaEm ?? iniciadaEm + ri(90, 380) * MIN) : null;

    const p = {
      id: `PET-${String(++seqCodigo).padStart(4, '0')}`,
      codigo: `PET-2026-${String(seqCodigo).padStart(4, '0')}`,
      tipo: cfg.tipo,
      titulo: cfg.titulo,
      unidade, areaId: cfg.areaId,
      local: cfg.local ?? rp(LOCAIS[cfg.areaId] ?? ['Local a definir']),
      responsavelId: responsavel,
      solicitanteId: solicitante,
      equipe, riscos, medidas, medicoes,
      epis, equipamentos, ferramentas, checklist,
      status: cfg.status,
      criadaEm,
      criadaPorId: responsavel,
      validadaEm, validadaPorId: done ? rp(gestores).id : null,
      liberadaEm, liberadaPorId: done ? rp(gestores).id : null,
      iniciadaEm, encerradaEm,
      inicioPrevisto: liberadaEm ?? criadaEm + HOUR,
      fimPrevisto: (liberadaEm ?? criadaEm + HOUR) + ativ.validadeH * HOUR,
      observacoes: cfg.observacoes ?? '',
      motivoCancelamento: cfg.motivo ?? null,
      suspensaMotivo: cfg.suspensaMotivo ?? null,
    };
    pets.push(p);
    return p;
  };

  const hoje0 = new Date(now); hoje0.setHours(0, 0, 0, 0);
  const t0 = hoje0.getTime();
  const h = (hh, mm = 0) => t0 + hh * HOUR + mm * MIN;

  /* ---- Today's operational picture (12 active / 4 in validation) ---- */
  const ativas = [
    { tipo: 'CONFINADO', areaId: 'A-TQ7', titulo: 'Inspeção interna e limpeza do tanque TQ-07', criadaEm: h(7, 2), tam: 6 },
    { tipo: 'ELETRICA',  areaId: 'A-SE2', titulo: 'Manutenção preventiva no cubículo 7', criadaEm: h(7, 18), tam: 5 },
    { tipo: 'ALTURA',    areaId: 'A-TR',  titulo: 'Substituição do ventilador VT-02', criadaEm: h(7, 40), tam: 6 },
    { tipo: 'CONFINADO', areaId: 'A-GT2', titulo: 'Desobstrução da galeria técnica N2', criadaEm: h(8, 5), tam: 5, medicaoFora: 'CO' },
    { tipo: 'QUENTE',    areaId: 'A-PT',  titulo: 'Soldagem do spool 220-A', criadaEm: h(8, 22), tam: 5 },
    { tipo: 'ELETRICA',  areaId: 'B-SE1', titulo: 'Termografia e reaperto no PC-11', criadaEm: h(8, 44), tam: 4 },
    { tipo: 'ICAMENTO',  areaId: 'B-DOC', titulo: 'Içamento de conjunto motobomba', criadaEm: h(9, 6), tam: 6 },
    { tipo: 'CONFINADO', areaId: 'B-R03', titulo: 'Inspeção da câmara seca R-03', criadaEm: h(9, 20), tam: 5 },
    { tipo: 'ELETRICA',  areaId: 'A-CM',  titulo: 'Troca de contatoras do painel B-104', criadaEm: h(9, 48), tam: 5 },
    { tipo: 'ESCAVACAO', areaId: 'A-PT',  titulo: 'Abertura de vala para nova linha', criadaEm: h(10, 2), tam: 6 },
    { tipo: 'ALTURA',    areaId: 'B-LP2', titulo: 'Manutenção no transportador TC-08', criadaEm: h(10, 30), tam: 5 },
    { tipo: 'QUENTE',    areaId: 'B-CB',  titulo: 'Reparo em tubulação da bomba BP-01', criadaEm: h(10, 55), tam: 5 },
  ];
  ativas.forEach((c) => build({ ...c, status: 'ATIVA' }));

  const validando = [
    { tipo: 'ALTURA',    areaId: 'A-TR',  titulo: 'Inspeção estrutural da passarela superior', criadaEm: now - 52 * MIN, tam: 3, checkDone: 5 },
    { tipo: 'CONFINADO', areaId: 'A-TQ7', titulo: 'Segunda etapa — jateamento interno TQ-07', criadaEm: now - 38 * MIN, tam: 4, checkDone: 6 },
    { tipo: 'ELETRICA',  areaId: 'B-SE1', titulo: 'Substituição de disjuntor geral', criadaEm: now - 24 * MIN, tam: 2, checkDone: 4 },
    { tipo: 'QUENTE',    areaId: 'A-PT',  titulo: 'Corte e remoção de trecho corroído', criadaEm: now - 11 * MIN, tam: 3, checkDone: 3 },
  ];
  validando.forEach((c) => build({ ...c, status: 'EM_VALIDACAO' }));

  /* Liberadas, aguardando início */
  build({ tipo: 'ICAMENTO', areaId: 'B-DOC', titulo: 'Descarregamento de skid de processo', criadaEm: h(11, 5), status: 'LIBERADA', tam: 3 });
  build({ tipo: 'ELETRICA', areaId: 'A-SE2', titulo: 'Ensaio de relés de proteção', criadaEm: h(11, 22), status: 'LIBERADA', tam: 2 });

  /* Suspensa por medição fora do parâmetro */
  build({
    tipo: 'CONFINADO', areaId: 'A-GT2', titulo: 'Reparo em tubulação enterrada — trecho 14',
    criadaEm: h(6, 40), status: 'SUSPENSA', tam: 3, medicaoFora: 'CO',
    suspensaMotivo: 'Concentração de CO acima do limite durante a execução.',
  });

  /* Rascunho */
  build({ tipo: 'ALTURA', areaId: 'A-TR', titulo: 'Pintura da estrutura metálica — célula 1', criadaEm: now - 6 * MIN, status: 'RASCUNHO', tam: 2 });

  /* ---- Historical volume for reports (last 45 days) ---- */
  const tipos = ATIVIDADES.map((a) => a.id);
  const areas = Object.keys(LOCAIS);
  for (let d = 1; d <= 45; d++) {
    const qtd = ri(2, 6);
    for (let k = 0; k < qtd; k++) {
      const criada = t0 - d * DAY + ri(6, 15) * HOUR + ri(0, 59) * MIN;
      const cancel = chance(.07);
      build({
        tipo: rp(tipos), areaId: rp(areas),
        titulo: 'Atividade programada de manutenção',
        criadaEm: criada,
        status: cancel ? 'CANCELADA' : 'ENCERRADA',
        motivo: cancel ? rp(['Condição climática adversa', 'Indisponibilidade de equipe', 'Reprogramação da parada', 'Medição fora do parâmetro']) : null,
        tam: ri(2, 5),
      });
    }
  }

  return pets;
}

/* ============================================================
   ACCESS EVENTS · ALERTS · AUDIT TRAIL
   ============================================================ */
function makeAccess(now, pets, emps) {
  const ev = [];
  const ativas = pets.filter((p) => p.status === 'ATIVA');
  for (const p of ativas) {
    for (const m of p.equipe) {
      const ts = (p.iniciadaEm ?? p.criadaEm) + ri(1, 9) * MIN;
      ev.push({
        id: `ACC-${ev.length + 1}`, ts, empId: m.empId, petId: p.id, areaId: p.areaId,
        unidade: p.unidade, resultado: 'LIBERADO', motivo: 'PET liberada e equipe autorizada',
        confianca: Number(rf(94.2, 99.6).toFixed(1)), metodo: 'FACIAL', direcao: 'ENTRADA',
      });
    }
  }
  /* Denied attempts — the risk the platform exists to catch */
  const irregulares = emps.filter((e) => e.status !== 'ATIVO' || !e.face);
  const negados = [
    { emp: irregulares[0], motivo: 'Nenhuma PET vigente vincula o colaborador à área', area: 'A-TQ7', min: 46 },
    { emp: irregulares[1] ?? emps[30], motivo: 'Treinamento NR-33 vencido', area: 'A-GT2', min: 128 },
    { emp: emps[35], motivo: 'Colaborador fora da área autorizada', area: 'B-R03', min: 214 },
  ];
  negados.forEach((n, i) => {
    if (!n.emp) return;
    ev.push({
      id: `ACC-N${i + 1}`, ts: now - n.min * MIN, empId: n.emp.id, petId: null, areaId: n.area,
      unidade: n.area.startsWith('A') ? 'UN-A' : 'UN-B', resultado: 'BLOQUEADO', motivo: n.motivo,
      confianca: Number(rf(91.0, 98.4).toFixed(1)), metodo: 'FACIAL', direcao: 'ENTRADA',
    });
  });
  /* Exits from closed PETs */
  pets.filter((p) => p.status === 'ENCERRADA' && p.encerradaEm > now - 2 * DAY).slice(0, 12).forEach((p, i) => {
    p.equipe.slice(0, 2).forEach((m, j) => {
      ev.push({
        id: `ACC-S${i}${j}`, ts: p.encerradaEm - ri(2, 10) * MIN, empId: m.empId, petId: p.id,
        areaId: p.areaId, unidade: p.unidade, resultado: 'LIBERADO', motivo: 'Saída registrada',
        confianca: Number(rf(93, 99).toFixed(1)), metodo: 'FACIAL', direcao: 'SAIDA',
      });
    });
  });
  return ev.sort((a, b) => b.ts - a.ts);
}

function makeAlerts(now, pets, emps, access, sensors) {
  const al = [];
  const push = (o) => al.push({
    id: `ALR-${String(al.length + 1).padStart(3, '0')}`,
    status: 'ABERTO', resolvidoPorId: null, resolvidoEm: null, ...o,
  });

  /* 1. Denied access → critical */
  const negado = access.find((a) => a.resultado === 'BLOQUEADO');
  if (negado) {
    push({
      ts: negado.ts, tipo: 'ACESSO_NEGADO', sev: 'risk',
      titulo: 'Tentativa de acesso não autorizado',
      descricao: `${emps.find((e) => e.id === negado.empId)?.nome ?? 'Colaborador'} — ${negado.motivo}.`,
      areaId: negado.areaId, unidade: negado.unidade, petId: null, empId: negado.empId,
    });
  }

  /* 2. Sensor excursion → warning */
  const fora = Object.values(sensors).find((s) => classify(s.param, s.ultimo) === 'risk');
  if (fora) {
    push({
      ts: now - 6 * MIN, tipo: 'MEDICAO_FORA', sev: 'warn',
      titulo: `${PARAMS[fora.param].nome} fora do parâmetro`,
      descricao: `Leitura de ${fora.ultimo} ${PARAMS[fora.param].unidade} — limite operacional ${PARAMS[fora.param].min}–${PARAMS[fora.param].max} ${PARAMS[fora.param].unidade}.`,
      areaId: fora.areaId, unidade: fora.areaId.startsWith('A') ? 'UN-A' : 'UN-B',
      petId: pets.find((p) => p.areaId === fora.areaId && p.status === 'ATIVA')?.id ?? null, empId: null,
    });
  }

  /* 3. PETs approaching expiry */
  pets.filter((p) => p.status === 'ATIVA' && p.fimPrevisto - now < 75 * MIN && p.fimPrevisto > now)
    .slice(0, 2).forEach((p) => push({
      ts: now - ri(3, 25) * MIN, tipo: 'PET_VENCENDO', sev: 'warn',
      titulo: 'PET próxima do vencimento',
      descricao: `${p.codigo} — ${p.titulo}. Validade encerra em breve.`,
      areaId: p.areaId, unidade: p.unidade, petId: p.id, empId: null,
    }));

  /* 4. Pending validations */
  pets.filter((p) => p.status === 'EM_VALIDACAO').slice(0, 2).forEach((p) => push({
    ts: p.criadaEm + 4 * MIN, tipo: 'PET_AGUARDANDO', sev: 'info',
    titulo: 'Nova PET aguardando validação',
    descricao: `${p.codigo} — ${p.titulo}.`,
    areaId: p.areaId, unidade: p.unidade, petId: p.id, empId: null,
  }));

  /* 5. Expired training */
  const irregular = emps.find((e) => e.status === 'PENDENTE');
  if (irregular) {
    push({
      ts: now - ri(120, 400) * MIN, tipo: 'EQUIPE_IRREGULAR', sev: 'warn',
      titulo: 'Treinamento obrigatório vencido',
      descricao: `${irregular.nome} (${irregular.matricula}) — regularizar antes de nova alocação.`,
      areaId: irregular.areas[0], unidade: irregular.unidade, petId: null, empId: irregular.id,
    });
  }

  /* 6. Historic, already handled */
  for (let i = 0; i < 9; i++) {
    const p = rp(pets.filter((x) => x.status === 'ENCERRADA'));
    const tipo = rp(['MEDICAO_FORA', 'PET_VENCENDO', 'ACESSO_NEGADO', 'SISTEMA']);
    al.push({
      id: `ALR-H${i + 1}`,
      ts: now - ri(1, 20) * DAY,
      tipo, sev: tipo === 'ACESSO_NEGADO' ? 'risk' : tipo === 'SISTEMA' ? 'info' : 'warn',
      titulo: tipo === 'SISTEMA' ? 'Sincronização de detectores concluída' : 'Ocorrência registrada e tratada',
      descricao: 'Ocorrência histórica encerrada pela equipe de segurança operacional.',
      areaId: p?.areaId ?? 'A-CM', unidade: p?.unidade ?? 'UN-A', petId: p?.id ?? null, empId: null,
      status: 'RESOLVIDO', resolvidoPorId: rp(emps.filter((e) => e.nivel === 'GESTOR')).id,
      resolvidoEm: now - ri(1, 19) * DAY,
    });
  }

  return al.sort((a, b) => b.ts - a.ts);
}

/** Rebuild the full audit trail from the entities, so both always agree. */
function makeEvents(pets, access, alerts, emps) {
  const ev = [];
  let n = 0;
  const add = (o) => ev.push({ id: `EVT-${String(++n).padStart(5, '0')}`, ...o });

  for (const p of pets) {
    const A = { petId: p.id, areaId: p.areaId, unidade: p.unidade };
    add({ ts: p.criadaEm, tipo: 'PET_CRIADA', atorId: p.criadaPorId, ...A, detalhe: p.titulo });
    add({ ts: p.criadaEm + 3 * MIN, tipo: 'EQUIPE_DEFINIDA', atorId: p.criadaPorId, ...A, detalhe: `${p.equipe.length} colaboradores vinculados` });
    add({ ts: p.criadaEm + 5 * MIN, tipo: 'RISCOS_AVALIADOS', atorId: p.criadaPorId, ...A, detalhe: `${p.riscos.length} riscos · ${p.medidas.length} medidas preventivas` });
    for (const m of p.medicoes) {
      add({
        ts: m.ts, tipo: m.status === 'risk' ? 'MEDICAO_FORA' : 'MEDICAO', atorId: m.byId, ...A,
        detalhe: `${PARAMS[m.param].nome}: ${m.valor} ${PARAMS[m.param].unidade}`,
      });
    }
    add({ ts: p.criadaEm + 17 * MIN, tipo: 'EQUIP_CONFERIDO', atorId: p.criadaPorId, ...A, detalhe: `${p.epis.length} EPIs · ${p.equipamentos.length} equipamentos` });
    if (p.status !== 'RASCUNHO') add({ ts: p.criadaEm + 20 * MIN, tipo: 'ENVIADA_VALIDACAO', atorId: p.criadaPorId, ...A, detalhe: 'Checklist de segurança submetido' });
    if (p.validadaEm) add({ ts: p.validadaEm, tipo: 'PET_VALIDADA', atorId: p.validadaPorId, ...A, detalhe: 'Checklist aprovado integralmente' });
    if (p.liberadaEm) add({ ts: p.liberadaEm, tipo: 'PET_LIBERADA', atorId: p.liberadaPorId, ...A, detalhe: 'Permissão liberada para execução' });
    if (p.iniciadaEm) add({ ts: p.iniciadaEm, tipo: 'ATIV_INICIADA', atorId: p.responsavelId, ...A, detalhe: p.local });
    if (p.status === 'SUSPENSA') add({ ts: p.iniciadaEm + 40 * MIN, tipo: 'ATIV_SUSPENSA', atorId: p.responsavelId, ...A, detalhe: p.suspensaMotivo });
    if (p.encerradaEm) {
      add({ ts: p.encerradaEm, tipo: 'ATIV_ENCERRADA', atorId: p.responsavelId, ...A, detalhe: 'Frente de serviço desmobilizada' });
      add({ ts: p.encerradaEm + 2 * MIN, tipo: 'PET_FINALIZADA', atorId: p.responsavelId, ...A, detalhe: 'Documentação arquivada digitalmente' });
    }
    if (p.status === 'CANCELADA') add({ ts: p.criadaEm + 30 * MIN, tipo: 'PET_CANCELADA', atorId: p.criadaPorId, ...A, detalhe: p.motivoCancelamento });
  }

  for (const a of access) {
    add({
      ts: a.ts, tipo: a.resultado === 'LIBERADO' ? 'ACESSO_LIBERADO' : 'ACESSO_BLOQUEADO',
      atorId: a.empId, petId: a.petId, areaId: a.areaId, unidade: a.unidade,
      detalhe: `${a.direcao === 'SAIDA' ? 'Saída' : 'Entrada'} · reconhecimento facial ${a.confianca}% · ${a.motivo}`,
    });
  }

  for (const a of alerts) {
    add({ ts: a.ts, tipo: 'ALERTA_GERADO', atorId: null, petId: a.petId, areaId: a.areaId, unidade: a.unidade, detalhe: a.titulo });
    if (a.status === 'RESOLVIDO') add({ ts: a.resolvidoEm, tipo: 'ALERTA_TRATADO', atorId: a.resolvidoPorId, petId: a.petId, areaId: a.areaId, unidade: a.unidade, detalhe: `Tratativa concluída — ${a.titulo}` });
  }

  for (const e of emps) {
    add({ ts: e.cadastradoEm, tipo: 'FUNC_CADASTRADO', atorId: null, alvoId: e.id, petId: null, areaId: e.areas[0], unidade: e.unidade, detalhe: `${e.nome} · ${e.funcao}` });
    if (e.face) add({ ts: e.cadastradoEm + 6 * MIN, tipo: 'FACE_REGISTRADA', atorId: null, alvoId: e.id, petId: null, areaId: e.areas[0], unidade: e.unidade, detalhe: `Qualidade do template: ${e.faceQualidade}%` });
  }

  return ev.sort((a, b) => b.ts - a.ts);
}

/* ============================================================
   PUBLIC
   ============================================================ */
function buildSeed() {
  R = mulberry32(20260904);
  const now = Date.now();
  const employees = makeEmployees(now);
  const sensors = makeSensors(now);
  const pets = makePets(now, employees);
  const access = makeAccess(now, pets, employees);
  const alerts = makeAlerts(now, pets, employees, access, sensors);
  const events = makeEvents(pets, access, alerts, employees);

  return {
    version: 4,
    geradoEm: now,
    employees, pets, sensors, access, alerts, events,
    session: null,
    ui: { unidade: 'TODAS', navCollapsed: false, simulacao: true },
  };
}

/** Identities offered on the facial-login screen. */
const DEMO_FACES = ['EMP-001', 'EMP-002', 'EMP-003', 'EMP-004'];

return { buildSeed, DEMO_FACES };
})();

const V = { fingerprint: '0 0 24 24' };

/**
 * @param {string} name  key in P
 * @param {number} [size] pixel size (falls back to CSS)
 * @param {string} [cls]  extra class names
 */
function icon(name, size, cls = '') {
  const d = P[name] || P.info;
  const sz = size ? ` width="${size}" height="${size}"` : '';
  return `<svg${sz} viewBox="${V[name] || '0 0 24 24'}" fill="none" stroke="currentColor" stroke-width="1.7"
    stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${d}</svg>`;
}

const hasIcon = (n) => Object.prototype.hasOwnProperty.call(P, n);

return { icon, hasIcon };
})();

const M_ui_brand = (() => {
/**
 * ARTECH — identidade da marca.

 * perda e assuma as cores corretas sobre o fundo escuro da plataforma.
 */

let n = 0;
const uid = (p) => `${p}${++n}`;

/**

        <stop offset="0%" stop-color="#12293F"/><stop offset="100%" stop-color="#33678C"/>

        <stop offset="0%" stop-color="#0A87A2"/><stop offset="48%" stop-color="#14BDD6"/>
        <stop offset="100%" stop-color="#3BE6F0"/>

      <linearGradient id="${gC}" x1="58" y1="160" x2="142" y2="96" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#12304C"/><stop offset="100%" stop-color="#2E668E"/>

    <!-- perna esquerda -->
    <path d="M88 20 L10 180 L50 180 L120 36 Z"
      fill="${flat ? 'currentColor' : `url(#${gL})`}" ${flat ? 'opacity=".7"' : ''}/>

    <!-- perna direita: a fita dobra sobre o ápice e fecha no gancho inferior -->
    <path d="M80 36 L86 26 L114 18 L188 170 Q196 188 176 192 Q154 195 147 178 Z"
      fill="${flat ? 'currentColor' : `url(#${gR})`}"/>

    <!-- contraforma central, à frente da fita -->
    <path d="M58 160 L96 96 L142 96 L104 160 Z"
      fill="${flat ? 'currentColor' : `url(#${gC})`}" ${flat ? 'opacity=".5"' : ''}/>
  </svg>`;
}

/**
 * Logotipo completo (símbolo + ARTECH + assinatura).
 * @param {{size?:number, tagline?:boolean, tone?:'light'|'dark'}} o
 */
function artechLogo({ size = 34, tagline = true, tone = 'light' } = {}) {
  const tx = tone === 'light' ? 'var(--tx-hi)' : '#12283C';
  const sub = tone === 'light' ? 'var(--tx-dim)' : '#64748B';
  return `<div class="artech-logo" style="--al-tx:${tx};--al-sub:${sub}">
    <span class="al-mark">${artechMark(size)}</span>
    <span class="al-tx">
      <span class="al-name" style="font-size:${size * 0.56}px">ARTECH</span>

        <i></i>Tecnologia que transforma<i></i></span>` : ''}
    </span>
  </div>`;
}

return { artechMark, artechLogo };
})();

/* ---------- src/store.js ---------- */
const M_store = (() => {
/**
 * PET CONTROL — Application state.
 *
 * A tiny observable store: one state object, explicit actions, and a
 * subscription list. Every mutation that matters operationally also writes
 * an entry to the audit trail (`events`) — that is the product's core promise,
 * so it lives in the store rather than in any single screen.
 */

const { buildSeed } = M_data_seed;
const { PARAMS, classify, CHECKLIST, atividadeById, areaById, can } = M_data_catalog;
const { uid, clamp, rnd, pick } = M_util;
const KEY = 'petcontrol.state.v4';
const MIN = 60000, HOUR = 3600000;

/* ============================================================
   Persistence
   ============================================================ */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s?.version !== 4) return null;
    /* Data is generated relative to "now"; a stale snapshot would show a
       frozen shift. Rebuild after 8h so the demo is always current. */
    if (Date.now() - s.geradoEm > 8 * HOUR) return null;
    return s;
  } catch { return null; }
}

function persist(s) {
  try {
    localStorage.setItem(KEY, JSON.stringify({ ...s, _saved: Date.now() }));
  } catch { /* private mode / quota — the demo still works in memory */ }
}

/* ============================================================
   Store
   ============================================================ */
const subs = new Set();
const state = load() ?? buildSeed();

let raf = null;
function emit(reason = 'change') {
  persist(state);
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = null;
    subs.forEach((fn) => fn(state, reason));
  });
}
function subscribe(fn) { subs.add(fn); return () => subs.delete(fn); }

function resetDemo() {
  const fresh = buildSeed();
  Object.keys(state).forEach((k) => delete state[k]);
  Object.assign(state, fresh);
  localStorage.removeItem(KEY);
  emit('reset');
}

/* ============================================================
   Lookups
   ============================================================ */
const emp     = (id) => state.employees.find((e) => e.id === id) ?? null;
const empNome = (id) => emp(id)?.nome ?? '—';
const pet     = (id) => state.pets.find((p) => p.id === id) ?? null;
const alerta  = (id) => state.alerts.find((a) => a.id === id) ?? null;
const me      = () => (state.session ? emp(state.session.userId) : null);
const myLevel = () => me()?.nivel ?? 'OPERADOR';
const allow   = (cap) => can(myLevel(), cap);

/* ============================================================
   Audit trail
   ============================================================ */
function log(tipo, payload = {}) {
  const e = {
    id: `EVT-${uid('x')}`,
    ts: Date.now(),
    tipo,
    atorId: state.session?.userId ?? null,
    petId: null, areaId: null, unidade: null, alvoId: null, detalhe: '',
    ...payload,
  };
  state.events.unshift(e);
  if (state.events.length > 4000) state.events.length = 4000;
  return e;
}

function raiseAlert({ tipo, sev, titulo, descricao, areaId, unidade, petId = null, empId = null }) {
  const a = {
    id: `ALR-${uid('a')}`, ts: Date.now(), tipo, sev, titulo, descricao,
    areaId, unidade: unidade ?? (areaId?.startsWith('A') ? 'UN-A' : 'UN-B'),
    petId, empId, status: 'ABERTO', resolvidoPorId: null, resolvidoEm: null,
  };
  state.alerts.unshift(a);
  log('ALERTA_GERADO', { petId, areaId, unidade: a.unidade, detalhe: titulo });
  return a;
}

/* ============================================================
   Session
   ============================================================ */
function signIn(empId, confianca) {
  const e = emp(empId);
  if (!e) return null;
  state.session = { userId: empId, iniciadaEm: Date.now(), confianca, metodo: 'FACIAL' };
  e.ultimoAcesso = Date.now();
  log('LOGIN', { areaId: e.areas[0], unidade: e.unidade, detalhe: `Reconhecimento facial · confiança ${confianca}% · nível ${e.nivel}` });
  emit('session');
  return state.session;
}

function signOut() {
  const e = me();
  if (e) log('LOGOUT', { areaId: e.areas[0], unidade: e.unidade, detalhe: 'Sessão encerrada pelo usuário' });
  state.session = null;
  emit('session');
}

/* ============================================================
   PET lifecycle
   ============================================================ */
function nextCodigo() {
  const nums = state.pets.map((p) => Number(String(p.codigo).split('-')[2] || 0));
  const n = Math.max(0, ...nums) + 1;
  return { codigo: `PET-2026-${String(n).padStart(4, '0')}`, id: `PET-${String(n).padStart(4, '0')}` };
}

function createPet(draft) {
  const { id, codigo } = nextCodigo();
  const ativ = atividadeById(draft.tipo);
  const now = Date.now();
  const area = areaById(draft.areaId);
  const checklist = {};
  CHECKLIST.forEach((c) => { checklist[c.id] = draft.checklist?.[c.id] ? { ok: true, byId: state.session?.userId, ts: now } : { ok: false }; });

  const p = {
    id, codigo,
    tipo: draft.tipo,
    titulo: draft.titulo,
    unidade: area?.unidade ?? 'UN-A',
    areaId: draft.areaId,
    local: draft.local,
    responsavelId: draft.responsavelId,
    solicitanteId: state.session?.userId ?? draft.responsavelId,
    equipe: draft.equipe ?? [],
    riscos: draft.riscos ?? [],
    medidas: draft.medidas ?? [],
    medicoes: (draft.medicoes ?? []).map((m) => ({ ...m, id: `MED-${uid('m')}`, ts: now, byId: state.session?.userId, status: classify(m.param, m.valor) })),
    epis: draft.epis ?? [],
    equipamentos: draft.equipamentos ?? [],
    ferramentas: draft.ferramentas ?? [],
    checklist,
    status: 'EM_VALIDACAO',
    criadaEm: now,
    criadaPorId: state.session?.userId ?? draft.responsavelId,
    validadaEm: null, validadaPorId: null,
    liberadaEm: null, liberadaPorId: null,
    iniciadaEm: null, encerradaEm: null,
    inicioPrevisto: draft.inicioPrevisto ?? now + 30 * MIN,
    fimPrevisto: draft.fimPrevisto ?? now + (ativ?.validadeH ?? 8) * HOUR,
    observacoes: draft.observacoes ?? '',
    motivoCancelamento: null, suspensaMotivo: null,
  };
  state.pets.unshift(p);

  const A = { petId: p.id, areaId: p.areaId, unidade: p.unidade };
  log('PET_CRIADA', { ...A, detalhe: p.titulo });
  log('EQUIPE_DEFINIDA', { ...A, detalhe: `${p.equipe.length} colaboradores vinculados` });
  log('RISCOS_AVALIADOS', { ...A, detalhe: `${p.riscos.length} riscos · ${p.medidas.length} medidas preventivas` });
  p.medicoes.forEach((m) => log(m.status === 'risk' ? 'MEDICAO_FORA' : 'MEDICAO', { ...A, detalhe: `${PARAMS[m.param].nome}: ${m.valor} ${PARAMS[m.param].unidade}` }));
  log('EQUIP_CONFERIDO', { ...A, detalhe: `${p.epis.length} EPIs · ${p.equipamentos.length} equipamentos` });
  log('ENVIADA_VALIDACAO', { ...A, detalhe: 'Checklist de segurança submetido' });

  raiseAlert({
    tipo: 'PET_AGUARDANDO', sev: 'info',
    titulo: 'Nova PET aguardando validação',
    descricao: `${p.codigo} — ${p.titulo}.`,
    areaId: p.areaId, unidade: p.unidade, petId: p.id,
  });

  emit('pets');
  return p;
}

function setChecklist(petId, itemId, ok) {

  p.checklist[itemId] = ok ? { ok: true, byId: state.session?.userId, ts: Date.now() } : { ok: false };

}

function validatePet(petId) {

  const now = Date.now();
  p.status = 'LIBERADA';
  p.validadaEm = now; p.validadaPorId = state.session?.userId;

  state.alerts.filter((a) => a.petId === p.id && a.tipo === 'PET_AGUARDANDO' && a.status === 'ABERTO')
    .forEach((a) => { a.status = 'RESOLVIDO'; a.resolvidoPorId = state.session?.userId; a.resolvidoEm = now; });
  emit('pets');
  return p;
}

function startPet(petId) {
  const p = pet(petId); if (!p || p.status !== 'LIBERADA') return null;
  p.status = 'ATIVA'; p.iniciadaEm = Date.now();
  log('ATIV_INICIADA', { petId: p.id, areaId: p.areaId, unidade: p.unidade, detalhe: p.local });

}

function suspendPet(petId, motivo) {

function closePet(petId) {

  p.status = 'ENCERRADA'; p.encerradaEm = now;
  const A = { petId: p.id, areaId: p.areaId, unidade: p.unidade };
  log('ATIV_ENCERRADA', { ...A, detalhe: 'Frente de serviço desmobilizada' });
  log('PET_FINALIZADA', { ...A, detalhe: 'Documentação arquivada digitalmente' });

function cancelPet(petId, motivo) {

/* ============================================================
   Measurements
   ============================================================ */
function registerMeasurement(petId, param, valor) {
  const p = pet(petId); if (!p) return null;
  const st = classify(param, valor);
  const m = { id: `MED-${uid('m')}`, param, valor, ts: Date.now(), byId: state.session?.userId, status: st };
  p.medicoes.push(m);

  const key = `${p.areaId}:${param}`;
  if (state.sensors[key]) {
    state.sensors[key].serie.push({ ts: m.ts, v: valor });
    state.sensors[key].ultimo = valor;
    if (state.sensors[key].serie.length > 120) state.sensors[key].serie.shift();
  }

  log(st === 'risk' ? 'MEDICAO_FORA' : 'MEDICAO', {
    petId: p.id, areaId: p.areaId, unidade: p.unidade,
    detalhe: `${PARAMS[param].nome}: ${valor} ${PARAMS[param].unidade}`,
  });

  if (st === 'risk') {
    raiseAlert({
      tipo: 'MEDICAO_FORA', sev: 'warn',
      titulo: `${PARAMS[param].nome} fora do parâmetro`,
      descricao: `${p.codigo} — leitura de ${valor} ${PARAMS[param].unidade} (limite ${PARAMS[param].min}–${PARAMS[param].max}).`,
      areaId: p.areaId, unidade: p.unidade, petId: p.id,
    });
  }
  emit('pets');
  return m;
}

/* ============================================================
   Employees

function createEmployee(data) {

/* ============================================================
   Access control — the authorization decision, in one place
   ============================================================ */
function evaluateAccess(empId, areaId) {
  const e = emp(empId);
  const now = Date.now();
  if (!e) return { ok: false, motivo: 'Biometria não corresponde a nenhum cadastro ativo', petId: null };
  if (!e.face) return { ok: false, motivo: 'Colaborador sem registro facial ativo', petId: null };
  if (e.status === 'AFASTADO') return { ok: false, motivo: 'Colaborador afastado', petId: null };
  if (e.status === 'PENDENTE') return { ok: false, motivo: 'Cadastro pendente de regularização', petId: null };

  const vencido = (e.treinamentos ?? []).find((t) => t.validade < now);
  if (vencido) return { ok: false, motivo: `Treinamento vencido — ${vencido.nome}`, petId: null };

  if (!e.areas.includes(areaId)) return { ok: false, motivo: 'Colaborador fora da área autorizada', petId: null };

  const p = state.pets.find((x) =>
    ['LIBERADA', 'ATIVA'].includes(x.status) &&
    x.areaId === areaId &&
    x.equipe.some((m) => m.empId === empId));

  if (!p) return { ok: false, motivo: 'Nenhuma PET vigente vincula o colaborador à área', petId: null };
  if (p.fimPrevisto < now) return { ok: false, motivo: `Permissão ${p.codigo} vencida`, petId: p.id };

  return { ok: true, motivo: `Autorizado pela ${p.codigo}`, petId: p.id };
}

function registerAccess(empId, areaId, direcao = 'ENTRADA') {
  const v = evaluateAccess(empId, areaId);
  const e = emp(empId);
  const confianca = Number(rnd(93.5, 99.4).toFixed(1));
  const unidade = areaId.startsWith('A') ? 'UN-A' : 'UN-B';
  const rec = {
    id: `ACC-${uid('c')}`, ts: Date.now(), empId, petId: v.petId, areaId, unidade,
    resultado: v.ok ? 'LIBERADO' : 'BLOQUEADO', motivo: v.motivo,
    confianca, metodo: 'FACIAL', direcao,
  };
  state.access.unshift(rec);
  if (e) e.ultimoAcesso = rec.ts;

  log(v.ok ? 'ACESSO_LIBERADO' : 'ACESSO_BLOQUEADO', {
    atorId: empId, petId: v.petId, areaId, unidade,
    detalhe: `${direcao === 'SAIDA' ? 'Saída' : 'Entrada'} · reconhecimento facial ${confianca}% · ${v.motivo}`,
  });

  if (!v.ok) {
    raiseAlert({
      tipo: 'ACESSO_NEGADO', sev: 'risk',
      titulo: 'Tentativa de acesso não autorizado',
      descricao: `${e?.nome ?? 'Não identificado'} — ${v.motivo}.`,
      areaId, unidade, empId,
    });
  }
  emit('access');
  return rec;
}

function resolveAlert(id) {

/* ============================================================

function setUI(patch) { Object.assign(state.ui, patch); emit('ui'); }

/* ============================================================
   LIVE SIMULATION
   Sensors drift, activities age and events appear — the operations
   centre feel. Purely client-side; disabled from Configurações.
   ============================================================ */
let timer = null;

function driftSensors() {
  const now = Date.now();
  let mudou = false;
  for (const s of Object.values(state.sensors)) {
    const p = PARAMS[s.param];
    let v = s.ultimo + rnd(-p.drift, p.drift) + (p.ideal - s.ultimo) * 0.05;
    v = clamp(v, p.scaleMin, p.scaleMax);
    const val = Number(v.toFixed(p.dec));
    const before = classify(s.param, s.ultimo);
    const after = classify(s.param, val);
    s.ultimo = val;
    s.serie.push({ ts: now, v: val });
    if (s.serie.length > 120) s.serie.shift();
    mudou = true;

    if (before !== 'risk' && after === 'risk') {
      const alvo = state.pets.find((x) => x.areaId === s.areaId && x.status === 'ATIVA');
      raiseAlert({
        tipo: 'MEDICAO_FORA', sev: 'warn',
        titulo: `${p.nome} fora do parâmetro`,
        descricao: `Leitura de ${val} ${p.unidade} em ${areaById(s.areaId)?.nome ?? s.areaId} — limite ${p.min}–${p.max} ${p.unidade}.`,
        areaId: s.areaId, petId: alvo?.id ?? null,
      });
    }
  }
  return mudou;
}

function ageActivities() {
  const now = Date.now();
  for (const p of state.pets) {
    if (p.status !== 'ATIVA') continue;
    const restante = p.fimPrevisto - now;
    if (restante < 45 * MIN && restante > 0 && !p._avisoVenc) {
      p._avisoVenc = true;
      raiseAlert({
        tipo: 'PET_VENCENDO', sev: 'warn',
        titulo: 'PET próxima do vencimento',
        descricao: `${p.codigo} — ${p.titulo}. Validade encerra em menos de 45 minutos.`,
        areaId: p.areaId, unidade: p.unidade, petId: p.id,
      });
    }
    if (restante <= 0 && !p._vencida) {
      p._vencida = true;
      raiseAlert({
        tipo: 'PET_VENCIDA', sev: 'risk',
        titulo: 'PET vencida com atividade em andamento',
        descricao: `${p.codigo} — renovar a permissão ou encerrar a atividade imediatamente.`,
        areaId: p.areaId, unidade: p.unidade, petId: p.id,
      });
    }
  }
}

/** Occasional access attempt at a turnstile, so the feed keeps moving. */
function randomAccess() {
  const ativas = state.pets.filter((p) => p.status === 'ATIVA');
  if (!ativas.length) return;
  const p = pick(ativas);
  const membro = pick(p.equipe);
  if (!membro) return;
  const seq = state.access.filter((a) => a.empId === membro.empId && a.petId === p.id);
  registerAccess(membro.empId, p.areaId, seq.length % 2 === 0 ? 'SAIDA' : 'ENTRADA');
}

function startSimulation() {
  if (timer) return;
  let tick = 0;
  timer = setInterval(() => {
    if (!state.ui.simulacao || !state.session) return;
    tick++;
    driftSensors();
    if (tick % 4 === 0) ageActivities();
    if (tick % 9 === 0 && Math.random() < 0.55) randomAccess();
    emit('tick');
  }, 5000);
}
function stopSimulation() { clearInterval(timer); timer = null; }

/* Expose for console-level demo control. */
if (typeof window !== 'undefined') window.PETCONTROL = { state, resetDemo, registerAccess, raiseAlert };

return { state, emit, subscribe, resetDemo, emp, empNome, pet, alerta, me, myLevel, allow, log, raiseAlert, signIn, signOut, createPet, setChecklist, validatePet, startPet, suspendPet, resumePet, closePet, cancelPet, registerMeasurement, createEmployee, registerFace, setEmployeeStatus, evaluateAccess, registerAccess, ackAlert, resolveAlert, setUI, startSimulation, stopSimulation };
})();

/* ---------- src/selectors.js ---------- */
const M_selectors = (() => {
/**
 * PET CONTROL — Derived views over the state.
 * Keeping the arithmetic here is what makes the dashboard, the reports and
 * the sidebar counters agree with each other.
 */

const { state } = M_store;
const { classify, CHECKLIST, areaById } = M_data_catalog;
const MIN = 60000, HOUR = 3600000, DAY = 86400000;

/* ---------- unit scope (top-bar selector) ---------- */
function scope() { return state.ui.unidade; }
function inScope(x) {
  const u = state.ui.unidade;
  return u === 'TODAS' || x?.unidade === u;
}

const petsInScope    = () => state.pets.filter(inScope);
const alertsInScope  = () => state.alerts.filter(inScope);
const accessInScope  = () => state.access.filter(inScope);
const eventsInScope  = () => state.events.filter((e) => !e.unidade || inScope(e));
const empsInScope    = () => state.employees.filter((e) => state.ui.unidade === 'TODAS' || e.unidade === state.ui.unidade);

/* ---------- headline operational numbers ---------- */
function kpis() {
  const pets = petsInScope();
  const ativas = pets.filter((p) => p.status === 'ATIVA');
  const validacao = pets.filter((p) => p.status === 'EM_VALIDACAO');
  const liberadas = pets.filter((p) => p.status === 'LIBERADA');
  const suspensas = pets.filter((p) => p.status === 'SUSPENSA');

  /* People currently inside: last movement per person on an active PET */
  const dentro = new Set();
  const ordenado = [...accessInScope()].sort((a, b) => a.ts - b.ts);
  for (const a of ordenado) {
    if (a.resultado !== 'LIBERADO') continue;
    if (a.direcao === 'ENTRADA') dentro.add(a.empId); else dentro.delete(a.empId);
  }
  /* Team members of active PETs count as allocated to the area */
  ativas.forEach((p) => p.equipe.forEach((m) => dentro.add(m.empId)));

  const abertos = alertsInScope().filter((a) => a.status !== 'RESOLVIDO');

  return {
    ativas: ativas.length,
    pessoas: dentro.size,
    validacao: validacao.length,
    liberadas: liberadas.length,
    suspensas: suspensas.length,
    alertas: abertos.length,
    alertasCriticos: abertos.filter((a) => a.sev === 'risk').length,
    andamento: ativas.filter((p) => p.iniciadaEm).length,
    pessoasIds: [...dentro],
  };
}

/* ---------- PET helpers ---------- */
function petProgress(p) {
  if (!p.iniciadaEm) return 0;
  const total = p.fimPrevisto - p.iniciadaEm;
  if (total <= 0) return 100;
  return Math.max(0, Math.min(100, ((Date.now() - p.iniciadaEm) / total) * 100));
}

function petChecklistDone(p) {
  return CHECKLIST.filter((c) => p.checklist?.[c.id]?.ok).length;
}

function petHealth(p) {
  const fora = p.medicoes.filter((m) => classify(m.param, m.valor) === 'risk').length;
  if (p.status === 'SUSPENSA' || fora) return 'risk';
  const restante = p.fimPrevisto - Date.now();
  if (p.status === 'ATIVA' && restante < 45 * MIN) return 'warn';
  const aten = p.medicoes.filter((m) => classify(m.param, m.valor) === 'warn').length;
  return aten ? 'warn' : 'ok';
}

/** Latest reading per parameter for a PET (falls back to the area sensor). */
function petReadings(p) {
  const out = new Map();
  for (const m of p.medicoes) out.set(m.param, m);
  for (const [pid, m] of out) {
    const s = state.sensors[`${p.areaId}:${pid}`];
    if (s && s.serie.length) out.set(pid, { ...m, valor: s.ultimo, ts: s.serie[s.serie.length - 1].ts, status: classify(pid, s.ultimo), live: true });
  }
  return [...out.values()];
}

const petsAtivas     = () => petsInScope().filter((p) => p.status === 'ATIVA').sort((a, b) => (b.iniciadaEm ?? 0) - (a.iniciadaEm ?? 0));
const petsValidacao  = () => petsInScope().filter((p) => p.status === 'EM_VALIDACAO').sort((a, b) => a.criadaEm - b.criadaEm);
const alertasAbertos = () => alertsInScope().filter((a) => a.status !== 'RESOLVIDO').sort((a, b) => b.ts - a.ts);

/* ---------- sensors ---------- */
function sensorsInScope() {
  return Object.values(state.sensors)
    .filter((s) => state.ui.unidade === 'TODAS' || areaById(s.areaId)?.unidade === state.ui.unidade)
    .sort((a, b) => {
      const rank = { risk: 0, warn: 1, ok: 2, idle: 3 };
      return rank[classify(a.param, a.ultimo)] - rank[classify(b.param, b.ultimo)];
    });
}

function sensorSummary() {
  const s = sensorsInScope();
  const c = { ok: 0, warn: 0, risk: 0 };
  s.forEach((x) => { c[classify(x.param, x.ultimo)] = (c[classify(x.param, x.ultimo)] ?? 0) + 1; });
  return { total: s.length, ...c };
}

/* ---------- traceability ---------- */
function timelineOf(petId) {
  return state.events.filter((e) => e.petId === petId).sort((a, b) => a.ts - b.ts);
}

/* ---------- reports ---------- */
function reportData(filtro = {}) {
  const { de, ate, unidade = 'TODAS', areaId = 'TODAS', tipo = 'TODAS', empId = 'TODOS', status = 'TODOS' } = filtro;
  const d0 = de ?? Date.now() - 30 * DAY;
  const d1 = ate ?? Date.now();

  const pets = state.pets.filter((p) => {
    if (p.criadaEm < d0 || p.criadaEm > d1) return false;
    if (unidade !== 'TODAS' && p.unidade !== unidade) return false;
    if (areaId !== 'TODAS' && p.areaId !== areaId) return false;
    if (tipo !== 'TODAS' && p.tipo !== tipo) return false;
    if (status !== 'TODOS' && p.status !== status) return false;
    if (empId !== 'TODOS' && !p.equipe.some((m) => m.empId === empId) && p.responsavelId !== empId) return false;
    return true;
  });

  const aprovadas = pets.filter((p) => p.validadaEm);
  const encerradas = pets.filter((p) => p.status === 'ENCERRADA');
  const canceladas = pets.filter((p) => p.status === 'CANCELADA');

  const tempos = aprovadas.filter((p) => p.validadaEm && p.criadaEm).map((p) => (p.validadaEm - p.criadaEm) / MIN);
  const tempoMedio = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : 0;

  const duracoes = encerradas.filter((p) => p.iniciadaEm && p.encerradaEm).map((p) => (p.encerradaEm - p.iniciadaEm) / HOUR);
  const duracaoMedia = duracoes.length ? duracoes.reduce((a, b) => a + b, 0) / duracoes.length : 0;

  const ids = new Set(pets.map((p) => p.id));
  const alerts = state.alerts.filter((a) => a.ts >= d0 && a.ts <= d1 && (unidade === 'TODAS' || a.unidade === unidade));
  const acessos = state.access.filter((a) => a.ts >= d0 && a.ts <= d1 && (unidade === 'TODAS' || a.unidade === unidade));
  const bloqueios = acessos.filter((a) => a.resultado === 'BLOQUEADO');

  return {
    periodo: [d0, d1],
    pets,
    total: pets.length,
    aprovadas: aprovadas.length,
    encerradas: encerradas.length,
    canceladas: canceladas.length,
    ativas: pets.filter((p) => p.status === 'ATIVA').length,
    validacao: pets.filter((p) => p.status === 'EM_VALIDACAO').length,
    tempoMedio,
    duracaoMedia,
    alertas: alerts.length,
    alertasCriticos: alerts.filter((a) => a.sev === 'risk').length,
    acessos: acessos.length,
    bloqueios: bloqueios.length,
    taxaBloqueio: acessos.length ? (bloqueios.length / acessos.length) * 100 : 0,
    horasHomem: encerradas.reduce((a, p) => a + (p.iniciadaEm && p.encerradaEm ? ((p.encerradaEm - p.iniciadaEm) / HOUR) * p.equipe.length : 0), 0),
    petsIds: ids,
  };
}

/** Daily buckets for the trend chart. */
function seriePorDia(dias = 14, filtro = {}) {
  const out = [];
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  for (let i = dias - 1; i >= 0; i--) {
    const d0 = hoje.getTime() - i * DAY;
    const d1 = d0 + DAY;
    const pets = state.pets.filter((p) => p.criadaEm >= d0 && p.criadaEm < d1 && (filtro.unidade === 'TODAS' || !filtro.unidade || p.unidade === filtro.unidade));
    out.push({
      ts: d0,
      total: pets.length,
      liberadas: pets.filter((p) => p.validadaEm).length,
      canceladas: pets.filter((p) => p.status === 'CANCELADA').length,
      alertas: state.alerts.filter((a) => a.ts >= d0 && a.ts < d1).length,
    });
  }
  return out;
}

/** Distribution of PETs across activity types. */
function porTipo(pets) {
  const m = new Map();
  pets.forEach((p) => m.set(p.tipo, (m.get(p.tipo) ?? 0) + 1));
  return [...m.entries()].map(([tipo, n]) => ({ tipo, n })).sort((a, b) => b.n - a.n);
}

/** Distribution across areas — for the risk heat list. */
function porArea(pets) {
  const m = new Map();
  pets.forEach((p) => m.set(p.areaId, (m.get(p.areaId) ?? 0) + 1));
  return [...m.entries()].map(([areaId, n]) => ({ areaId, n })).sort((a, b) => b.n - a.n);
}

return { scope, inScope, petsInScope, alertsInScope, accessInScope, eventsInScope, empsInScope, kpis, petProgress, petChecklistDone, petHealth, petReadings, petsAtivas, petsValidacao, alertasAbertos, sensorsInScope, sensorSummary, timelineOf, reportData, seriePorDia, porTipo, porArea };
})();

/* ---------- src/ui/charts.js ---------- */
const M_ui_charts = (() => {
/**
 * PET CONTROL — SVG chart primitives.
 * Deliberately dependency-free: every chart is a pure string builder so it can
 * be dropped into any template and re-rendered on each state change.
 */

const { esc, nf } = M_util;
const SERIES = ['#22D3EE', '#60A5FA', '#2DD4A7', '#A78BFA', '#F5B02C', '#F0574D', '#94A3B8', '#0EA5E9'];
const TONE = { ok: '#2DD4A7', warn: '#F5B02C', risk: '#F0574D', info: '#60A5FA', idle: '#64748B', ac: '#22D3EE' };

let gid = 0;
const nid = (p) => `${p}${++gid}`;

const path = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

/** Catmull-Rom → cubic bezier, for smooth but honest curves. */
function smooth(pts) {
  if (pts.length < 3) return path(pts);
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] ?? pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] ?? p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

/* ============================================================
   AREA / LINE CHART
   ============================================================ */
function areaChart({
  series, labels = [], h = 190, w = 640, pad = { t: 14, r: 10, b: 22, l: 30 },
  yMin = null, yMax = null, bands = [], curve = true, dots = false, yFmt = (v) => nf(v),
}) {
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const all = series.flatMap((s) => s.data);
  const lo = yMin ?? Math.min(...all, 0);
  const hi = yMax ?? Math.max(...all, 1);
  const span = hi - lo || 1;
  const n = Math.max(1, series[0]?.data.length ?? 1);
  const X = (i) => pad.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = (v) => pad.t + ih - ((v - lo) / span) * ih;

  const ticks = 4;
  let grid = '';
  for (let i = 0; i <= ticks; i++) {
    const v = lo + (span * i) / ticks;
    const y = Y(v);
    grid += `<line class="grid-l" x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w - pad.r}" y2="${y.toFixed(1)}"/>`;
    grid += `<text class="axis-t" x="${pad.l - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end">${esc(yFmt(v))}</text>`;
  }

  let bandSvg = '';
  for (const b of bands) {
    const y1 = Y(Math.min(b.max, hi)), y2 = Y(Math.max(b.min, lo));
    bandSvg += `<rect x="${pad.l}" y="${y1.toFixed(1)}" width="${iw}" height="${Math.max(0, y2 - y1).toFixed(1)}" fill="${b.color}" opacity="${b.opacity ?? .07}"/>`;
    if (b.line != null) {
      const yl = Y(b.line);
      bandSvg += `<line x1="${pad.l}" y1="${yl.toFixed(1)}" x2="${w - pad.r}" y2="${yl.toFixed(1)}" stroke="${b.color}" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/>`;
    }
  }

  let body = '';
  series.forEach((s, si) => {
    const color = s.color ?? SERIES[si % SERIES.length];
    const pts = s.data.map((v, i) => [X(i), Y(v)]);
    const d = curve ? smooth(pts) : path(pts);
    const g = nid('grad');
    if (s.fill !== false) {
      body += `<defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".26"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
      body += `<path d="${d} L${X(n - 1).toFixed(1)},${(pad.t + ih).toFixed(1)} L${X(0).toFixed(1)},${(pad.t + ih).toFixed(1)} Z" fill="url(#${g})"/>`;
    }
    body += `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (dots) pts.forEach((p) => { body += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2" fill="${color}"/>`; });
    const last = pts[pts.length - 1];
    if (last) body += `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="${color}"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="6" fill="${color}" opacity=".18"/>`;
  });

  let xs = '';
  const step = Math.max(1, Math.ceil(labels.length / 7));
  labels.forEach((l, i) => {
    if (i % step && i !== labels.length - 1) return;
    xs += `<text class="axis-t" x="${X(i).toFixed(1)}" y="${h - 5}" text-anchor="middle">${esc(l)}</text>`;
  });

  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="height:${h}px" preserveAspectRatio="none">
    ${bandSvg}${grid}${body}${xs}</svg>`;
}

/* ============================================================
   BAR CHART (stacked or grouped)
   ============================================================ */
function barChart({ series, labels, h = 190, w = 640, pad = { t: 14, r: 10, b: 22, l: 30 }, stacked = true, radius = 2 }) {
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const n = labels.length || 1;
  const totals = labels.map((_, i) => (stacked ? series.reduce((a, s) => a + (s.data[i] ?? 0), 0) : Math.max(...series.map((s) => s.data[i] ?? 0))));
  const hi = Math.max(1, ...totals);
  const slot = iw / n;
  const bw = Math.max(2.5, Math.min(stacked ? 22 : 26 / series.length, (slot * 0.82) / (stacked ? 1 : series.length)));

  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + ih - (ih * i) / 4;
    grid += `<line class="grid-l" x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w - pad.r}" y2="${y.toFixed(1)}"/>`;
    grid += `<text class="axis-t" x="${pad.l - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end">${Math.round((hi * i) / 4)}</text>`;
  }

  let bars = '';
  labels.forEach((l, i) => {
    const cx = pad.l + slot * i + slot / 2;
    let acc = 0;
    series.forEach((s, si) => {
      const v = s.data[i] ?? 0;
      if (v <= 0) return;
      const bh = (v / hi) * ih;
      const color = s.color ?? SERIES[si % SERIES.length];
      const x = stacked ? cx - bw / 2 : cx - (bw * series.length) / 2 + si * bw;
      const y = stacked ? pad.t + ih - acc - bh : pad.t + ih - bh;
      bars += `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - (stacked ? 0 : 1.5)).toFixed(1)}" height="${Math.max(1, bh).toFixed(1)}" rx="${radius}" fill="${color}"><title>${esc(s.name)} — ${esc(l)}: ${v}</title></rect>`;
      acc += bh;
    });
  });

  let xs = '';
  const step = Math.max(1, Math.ceil(n / 8));
  labels.forEach((l, i) => {
    if (i % step && i !== n - 1) return;
    xs += `<text class="axis-t" x="${(pad.l + slot * i + slot / 2).toFixed(1)}" y="${h - 5}" text-anchor="middle">${esc(l)}</text>`;
  });

  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="height:${h}px" preserveAspectRatio="none">${grid}${bars}${xs}</svg>`;
}

/* ============================================================
   HORIZONTAL BARS (ranking)
   ============================================================ */
function hBars({ items, max = null, showValue = true }) {
  const hi = max ?? Math.max(1, ...items.map((i) => i.value));
  return `<div class="col g-3">${items.map((it) => `
    <div>
      <div class="row-b" style="margin-bottom:5px">
        <span style="font-size:12px;color:var(--tx)">${esc(it.label)}</span>
        ${showValue ? `<span class="num" style="font-size:12px">${nf(it.value)}${it.suffix ?? ''}</span>` : ''}
      </div>
      <div class="progress"><i style="width:${((it.value / hi) * 100).toFixed(1)}%;background:${it.color ?? 'var(--ac)'}"></i></div>
    </div>`).join('')}</div>`;
}

/* ============================================================
   DONUT
   ============================================================ */
function donut({ items, size = 148, thickness = 13, centerTop = '', centerBottom = '' }) {
  const total = items.reduce((a, i) => a + i.value, 0) || 1;
  const r = (size - thickness) / 2;
  const C = 2 * Math.PI * r;
  let off = 0;
  const arcs = items.map((it, i) => {
    const frac = it.value / total;
    const len = frac * C;
    const seg = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none"
      stroke="${it.color ?? SERIES[i % SERIES.length]}" stroke-width="${thickness}"
      stroke-dasharray="${Math.max(0, len - 1.6).toFixed(2)} ${(C - len + 1.6).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}" stroke-linecap="butt"
      transform="rotate(-90 ${size / 2} ${size / 2})"><title>${esc(it.label)}: ${it.value}</title></circle>`;
    off += len;
    return seg;
  }).join('');

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex:none">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.045)" stroke-width="${thickness}"/>
    ${arcs}
    ${centerTop ? `<text x="${size / 2}" y="${size / 2 - 2}" text-anchor="middle" fill="#E8EDF4" font-family="var(--f-mono)" font-size="23" font-weight="600">${esc(centerTop)}</text>` : ''}
    ${centerBottom ? `<text x="${size / 2}" y="${size / 2 + 15}" text-anchor="middle" fill="#5A6474" font-size="9.5" letter-spacing="1.4">${esc(centerBottom)}</text>` : ''}
  </svg>`;
}

/* ============================================================
   SPARKLINE
   ============================================================ */
function spark({ data, w = 108, h = 34, color = '#22D3EE', fill = true }) {
  if (!data.length) return '';
  const lo = Math.min(...data), hi = Math.max(...data);
  const span = hi - lo || 1;
  const pts = data.map((v, i) => [(i / (data.length - 1 || 1)) * w, h - 3 - ((v - lo) / span) * (h - 6)]);
  const d = smooth(pts);
  const g = nid('sp');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none">
    ${fill ? `<defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${d} L${w},${h} L0,${h} Z" fill="url(#${g})"/>` : ''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/></svg>`;
}

/* ============================================================
   RADIAL GAUGE  (single measurement against its safe band)
   ============================================================ */
function radial({ value, min, max, safeMin, safeMax, size = 128, tone = '#22D3EE', label = '', unit = '' }) {
  const r = size / 2 - 12;
  const cx = size / 2, cy = size / 2;
  const A0 = 135, A1 = 405;                       // 270° sweep
  const ang = (v) => A0 + ((v - min) / (max - min || 1)) * (A1 - A0);
  const pt = (a, rr = r) => [cx + rr * Math.cos((a * Math.PI) / 180), cy + rr * Math.sin((a * Math.PI) / 180)];
  const arc = (a0, a1, rr = r) => {
    const [x0, y0] = pt(a0, rr), [x1, y1] = pt(a1, rr);
    return `M${x0.toFixed(1)},${y0.toFixed(1)} A${rr},${rr} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)},${y1.toFixed(1)}`;
  };
  const v = Math.max(min, Math.min(max, value));
  const [nx, ny] = pt(ang(v), r - 1);
  const [ix, iy] = pt(ang(v), r - 13);

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <path d="${arc(A0, A1)}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="8" stroke-linecap="round"/>
    <path d="${arc(ang(safeMin), ang(safeMax))}" fill="none" stroke="rgba(45,212,167,.28)" stroke-width="8" stroke-linecap="round"/>
    <path d="${arc(A0, ang(v))}" fill="none" stroke="${tone}" stroke-width="3" stroke-linecap="round" opacity=".85"/>
    <line x1="${ix.toFixed(1)}" y1="${iy.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${tone}" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="${tone}"/>
    <text x="${cx}" y="${cy + 26}" text-anchor="middle" fill="#E8EDF4" font-family="var(--f-mono)" font-size="17" font-weight="600">${esc(String(value))}<tspan font-size="10" fill="#5A6474"> ${esc(unit)}</tspan></text>
    <text x="${cx}" y="${cy + 40}" text-anchor="middle" fill="#414B59" font-size="8.5" letter-spacing="1.2">${esc(label.toUpperCase())}</text>
  </svg>`;
}

/* ============================================================
   LEGEND
   ============================================================ */
function legend(items) {
  return `<div class="legend">${items.map((i) => `
    <span class="li"><i style="background:${i.color}"></i>${esc(i.label)}${i.value != null ? ` <b>${nf(i.value)}</b>` : ''}</span>`).join('')}</div>`;
}

return { SERIES, TONE, areaChart, barChart, hBars, donut, spark, radial, legend };
})();

/* ---------- src/ui/kit.js ---------- */
const M_ui_kit = (() => {
/**
 * PET CONTROL — Shared render helpers.

 * avatars, badges and status chips.

const { esc, initials, hueOf, ago, hhmm, dtFull } = M_util;

const { PET_STATUS, NIVEIS, STATUS_MEDICAO, SEV, areaName, unitName, atividadeNome, PARAMS, classify } = M_data_catalog;
/* ---------------- Avatar ---------------- */
function avatar(person, size = '', extra = '') {
  if (!person) return `<div class="av ${size}" style="background:var(--bg-panel-2);color:var(--tx-dim)">?</div>`;
  const h = hueOf(person.id ?? person.nome ?? '');
  const style = `background:linear-gradient(140deg, hsl(${h} 62% 62%), hsl(${(h + 42) % 360} 58% 40%))`;
  const face = person.face ? 'av-face' : '';
  return `<div class="av ${size} ${face} ${extra}" style="${style}" title="${esc(person.nome ?? '')}">${esc(initials(person.nome ?? '?'))}</div>`;
}

function avatarStack(people, max = 4) {
  const shown = people.slice(0, max);
  const rest = people.length - shown.length;
  return `<div class="av-stack">${shown.map((p) => avatar(p, 'av-sm')).join('')}${
    rest > 0 ? `<div class="av av-sm av-more">+${rest}</div>` : ''}</div>`;
}

/* ---------------- Status chips ---------------- */
function petBadge(status, live = false) {

/** Measurement gauge card used by the PET form and the monitoring screen. */
function gaugeCard(paramId, valor, { ts = null, live = false, compact = false } = {}) {
  const p = PARAMS[paramId];
  const st = classify(paramId, valor);
  const pct = ((valor - p.scaleMin) / (p.scaleMax - p.scaleMin)) * 100;
  const bandL = ((p.min - p.scaleMin) / (p.scaleMax - p.scaleMin)) * 100;
  const bandW = ((p.max - p.min) / (p.scaleMax - p.scaleMin)) * 100;
  const tone = st === 'risk' ? 'var(--risk)' : st === 'warn' ? 'var(--warn)' : 'var(--ok)';

  return `<div class="gauge-card st-${st}">
    <div class="row-b" style="margin-bottom:9px">
      <div class="row g-2">
        <span style="color:${tone};display:flex">${icon(p.icon, 14)}</span>

      <div class="g-val">${esc(String(valor))} <span class="g-unit">${esc(p.unidade)}</span></div>
      ${medBadge(st)}
    </div>
    ${compact ? '' : `
    <div class="meter" style="margin-top:12px">
      <div class="band" style="left:${bandL.toFixed(1)}%;width:${bandW.toFixed(1)}%"></div>
      <div class="needle" style="left:calc(${Math.max(0, Math.min(100, pct)).toFixed(1)}% - 1px);color:${tone};background:${tone}"></div>
    </div>
    <div class="row-b" style="margin-top:6px">
      <span class="mono" style="font-size:9.5px;color:var(--tx-dim)">${p.min} – ${p.max} ${esc(p.unidade)}</span>
      ${ts ? `<span class="mono" style="font-size:9.5px;color:var(--tx-dim)">${esc(hhmm(ts))}</span>` : ''}
    </div>`}
  </div>`;
}

/* ---------- src/ui/overlay.js ---------- */
const M_ui_overlay = (() => {
/**
 * PET CONTROL — Toasts, modals and drawers.
 * Feedback for every consequential action is a product requirement here:
 * approving a permit or blocking an access must never happen silently.
 */

const { el, esc, $ } = M_util;
const { icon } = M_ui_icons;
/* ============================================================
   TOASTS
   ============================================================ */
const TONES = {
  ok:   { c: 'var(--ok)',   i: 'okCircle' },
  warn: { c: 'var(--warn)', i: 'warnCircle' },
  risk: { c: 'var(--risk)', i: 'xCircle' },
  info: { c: 'var(--ac)',   i: 'info' },
};

function host() {
  let h = $('#toasts');
  if (!h) { h = el('<div id="toasts" role="status" aria-live="polite"></div>'); document.body.appendChild(h); }
  return h;
}

function toast(title, sub = '', tone = 'info', ms = 4200) {
  const t = TONES[tone] ?? TONES.info;
  const node = el(`<div class="toast" style="--tc:${t.c}">
    <span class="ti">${icon(t.i)}</span>
    <div class="grow"><div class="tt">${esc(title)}</div>${sub ? `<div class="ts">${esc(sub)}</div>` : ''}</div>
    <button class="tx" aria-label="Fechar">${icon('x')}</button>
  </div>`);
  const close = () => {
    node.classList.add('out');
    setTimeout(() => node.remove(), 220);
  };
  node.querySelector('.tx').addEventListener('click', close);
  host().appendChild(node);
  if (ms) setTimeout(close, ms);
  return close;
}

/* ============================================================
   MODAL
   ============================================================ */
let openLayer = null;

function mount(node) {
  close();
  openLayer = node;
  document.body.appendChild(node);
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  node._onKey = onKey;
  const focusable = node.querySelector('input, select, textarea, button.btn-primary, button');
  setTimeout(() => focusable?.focus(), 60);
}

function close() {
  if (!openLayer) return;
  document.removeEventListener('keydown', openLayer._onKey);
  const n = openLayer; openLayer = null;
  n.style.animation = 'fade-in .16s ease reverse forwards';
  setTimeout(() => n.remove(), 170);
}

/**
 * @param {{title:string, sub?:string, body:string, footer?:string, width?:number,
 *          onMount?:(root:HTMLElement)=>void}} o
 */
function modal(o) {
  const node = el(`<div class="overlay" role="dialog" aria-modal="true">
    <div class="modal" style="--mw:${o.width ?? 620}px">
      <header class="modal-hd">
        <div><h3>${esc(o.title)}</h3>${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ''}</div>
        <button class="top-btn" data-close aria-label="Fechar">${icon('x')}</button>
      </header>
      <div class="modal-bd">${o.body}</div>
      ${o.footer ? `<footer class="modal-ft">${o.footer}</footer>` : ''}
    </div>
  </div>`);
  node.addEventListener('click', (e) => { if (e.target === node || e.target.closest('[data-close]')) close(); });
  mount(node);
  o.onMount?.(node);
  return node;
}

function drawer(o) {
  const node = el(`<div class="overlay" role="dialog" aria-modal="true">
    <aside class="drawer" style="--dw:${o.width ?? 560}px">
      <header class="modal-hd">
        <div><h3>${esc(o.title)}</h3>${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ''}</div>
        <button class="top-btn" data-close aria-label="Fechar">${icon('x')}</button>
      </header>
      <div class="modal-bd grow">${o.body}</div>
      ${o.footer ? `<footer class="modal-ft">${o.footer}</footer>` : ''}
    </aside>
  </div>`);
  node.addEventListener('click', (e) => { if (e.target === node || e.target.closest('[data-close]')) close(); });
  mount(node);
  o.onMount?.(node);
  return node;
}

/** Confirmation dialog — used before irreversible operational decisions. */
function confirm({ title, message, confirmLabel = 'Confirmar', tone = 'primary', requireReason = false, onConfirm }) {
  modal({
    title,
    width: 480,
    body: `<p style="font-size:13px;line-height:1.6;color:var(--tx)">${esc(message)}</p>
      ${requireReason ? `<div class="field" style="margin-top:16px">
        <label for="cf-reason">Justificativa</label>
        <textarea id="cf-reason" class="ta" placeholder="Descreva o motivo — o registro será mantido na trilha de auditoria."></textarea>
      </div>` : ''}`,
    footer: `<button class="btn" data-close>Cancelar</button>
      <button class="btn btn-${tone}" id="cf-ok">${esc(confirmLabel)}</button>`,
    onMount(root) {
      root.querySelector('#cf-ok').addEventListener('click', () => {
        const reason = root.querySelector('#cf-reason')?.value.trim() ?? '';
        if (requireReason && reason.length < 5) {
          const f = root.querySelector('#cf-reason');
          f.classList.add('inp');
          f.style.borderColor = 'rgba(240,87,77,.6)';
          f.focus();
          return;
        }
        close();
        onConfirm(reason);
      });
    },
  });
}

return { toast, close, modal, drawer, confirm };
})();

const M_ui_camera = (() => {
/**
 * PET CONTROL — Camera surface for the facial-identification experience.
 *
 * MVP scope: the biometric matching is SIMULATED against registered employees.
 * The camera itself is real when the browser grants access; otherwise we render
 * a synthetic feed so the demo never depends on hardware or permissions.
 */

const { rnd } = M_util;
let sharedStream = null;

/** Try the real webcam; fall back silently. */
async function requestStream() {
  if (sharedStream) return sharedStream;
  if (!navigator.mediaDevices?.getUserMedia) return null;
  try {
    sharedStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false,
    });
    return sharedStream;
  } catch { return null; }
}

function releaseStream() {
  sharedStream?.getTracks().forEach((t) => t.stop());
  sharedStream = null;
}

/**
 * Attach a feed to a container. Returns a stop() function.
 * @param {HTMLElement} box
 */
async function attachFeed(box) {
  const stream = await requestStream();
  if (stream) {
    const v = document.createElement('video');
    v.autoplay = true; v.muted = true; v.playsInline = true;
    v.srcObject = stream;
    box.prepend(v);
    return () => { v.remove(); };
  }
  return syntheticFeed(box);
}

/**
 * Synthetic "thermal-ish" camera feed: drifting scan bands + sensor grain.
 * Reads as equipment output rather than a broken video element.
 */
function syntheticFeed(box) {
  const c = document.createElement('canvas');
  c.className = 'feed';
  c.width = 320; c.height = 240;
  box.prepend(c);
  const ctx = c.getContext('2d');
  let raf, t = 0;
  const blobs = Array.from({ length: 5 }, () => ({
    x: rnd(0.2, 0.8), y: rnd(0.2, 0.8), r: rnd(0.15, 0.4), s: rnd(0.0004, 0.0016), p: rnd(0, 6.28),
  }));

  const draw = () => {
    t += 1;
    const g = ctx.createLinearGradient(0, 0, 0, c.height);
    g.addColorStop(0, '#0B141A'); g.addColorStop(1, '#060A0E');
    ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);

    /* soft silhouette so the face frame has something to sit on */
    const cx = c.width / 2 + Math.sin(t * 0.006) * 5;
    const cy = c.height * 0.52 + Math.cos(t * 0.005) * 4;
    const rg = ctx.createRadialGradient(cx, cy, 8, cx, cy, 84);
    rg.addColorStop(0, 'rgba(34,211,238,.16)');
    rg.addColorStop(.55, 'rgba(34,211,238,.05)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.ellipse(cx, cy, 62, 82, 0, 0, 6.29); ctx.fill();

    for (const b of blobs) {
      b.p += b.s * 60;
      const x = (b.x + Math.sin(b.p) * 0.05) * c.width;
      const y = (b.y + Math.cos(b.p * 0.8) * 0.05) * c.height;
      const r = b.r * 90;
      const rr = ctx.createRadialGradient(x, y, 0, x, y, r);
      rr.addColorStop(0, 'rgba(96,165,250,.05)');
      rr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rr;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill();
    }

    /* sensor grain */
    ctx.fillStyle = 'rgba(255,255,255,.028)';
    for (let i = 0; i < 220; i++) {
      ctx.fillRect(Math.random() * c.width | 0, Math.random() * c.height | 0, 1, 1);
    }
    raf = requestAnimationFrame(draw);
  };
  draw();
  return () => { cancelAnimationFrame(raf); c.remove(); };
}

/** Landmark mesh overlay — 24 points with a light triangulation. */
function meshSVG() {
  const pts = [
    [38, 30], [50, 26], [62, 30], [30, 40], [70, 40], [26, 52], [74, 52],
    [38, 44], [62, 44], [42, 46], [58, 46], [50, 50], [50, 58],
    [44, 63], [56, 63], [50, 66], [34, 64], [66, 64], [30, 72], [70, 72],
    [40, 76], [60, 76], [50, 79], [50, 86],
  ];
  const links = [[0,1],[1,2],[0,3],[2,4],[3,5],[4,6],[7,9],[8,10],[9,11],[10,11],[11,12],[12,13],[12,14],[13,15],[14,15],[5,16],[6,17],[16,18],[17,19],[18,20],[19,21],[20,22],[21,22],[22,23],[13,20],[14,21],[0,7],[2,8]];
  const L = links.map(([a, b]) => `<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}"/>`).join('');
  const C = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i % 5 === 0 ? 1.1 : .75}"/>`).join('');
  return `<svg class="mesh" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">${L}${C}</svg>`;
}

return { requestStream, releaseStream, attachFeed, meshSVG };
})();

const { $, el, esc, sleep, rnd } = M_util;

const { avatar, levelTag } = M_ui_kit;
const { artechLogo } = M_ui_brand;

    <!-- ---------- scanner ---------- -->

          </div>

      </div>

      <div class="pipe" id="au-pipe">
        ${PIPE.map((s, i) => `<div class="pipe-step" data-step="${s.id}">

          ${icon('userX')} Simular rosto não cadastrado
        </button>
      </div>

  </div>`);

  document.body.appendChild(root);

  /* demo identities */
  const faces = DEMO_FACES.map((id) => state.employees.find((e) => e.id === id)).filter(Boolean);
  $('#au-grid', root).innerHTML = faces.map((e) => `
    <button class="dp-card" data-emp="${esc(e.id)}">
      ${avatar(e, 'av-sm')}
      <span class="dp-tx">
        <span class="a">${esc(e.nome)}</span>
        <span class="b">${levelTag(e.nivel)}</span>
      </span>
    </button>`).join('');

  let stopFeed = () => {};
  attachFeed($('#au-cam', root)).then((s) => { stopFeed = s; setStatus('idle'); });

  /* ---------- state helpers ---------- */
  const cam = $('#au-cam', root);
  const setCam = (cls) => { cam.className = `cam ${cls}`; };
  const setStep = (id, cls) => {
    const n = root.querySelector(`[data-step="${id}"]`);
    if (!n) return;
    n.className = `pipe-step ${cls}`;
    n.querySelector('.pi').innerHTML = cls === 'doing' ? '<span class="spin"></span>'
      : cls === 'done' ? icon('check', 12)
      : cls === 'fail' ? icon('x', 12)
      : icon('chevR', 12);
  };
  const resetSteps = () => PIPE.forEach((s) => setStep(s.id, ''));

  function setStatus(kind, { titulo, sub, conf } = {}) {
    const map = {
      idle:   ['Câmera em espera', 'Aguardando aproximação'],
      scan:   ['Leitura facial em andamento', 'Capturando pontos de referência'],
      lock:   ['Rosto detectado', 'Estabilizando template biométrico'],
      verify: ['Consultando base de colaboradores', 'Verificando permissões vigentes'],
      ok:     ['Identificação concluída', 'Permissão validada'],
      bad:    ['Identificação falhou', 'Nenhuma correspondência na base'],
    };
    const [a, b] = map[kind] ?? map.idle;
    $('#au-st', root).textContent = titulo ?? a;
    $('#au-sub', root).textContent = sub ?? `CAM-01 · PORTARIA UN-A · ${b}`;
    $('#au-conf', root).textContent = conf != null ? `${conf}%` : '—';
  }

  let busy = false;

  /* ---------- the identification pipeline ---------- */
  async function identify(empId) {
    if (busy) return;
    busy = true;
    $('#au-pick', root).style.opacity = '.4';
    $('#au-pick', root).style.pointerEvents = 'none';
    $('#au-result', root).innerHTML = '';
    resetSteps();

    const person = empId ? state.employees.find((e) => e.id === empId) : null;

    /* 01 — camera */
    setCam('st-scan'); setStep('cam', 'doing'); setStatus('scan');
    await sleep(420); setStep('cam', 'done');

    /* 02 — facial read */
    setStep('read', 'doing');
    let conf = 0;
    const target = person ? rnd(96.4, 99.4) : rnd(38, 61);
    const t0 = performance.now();
    await new Promise((res) => {
      const tickAnim = () => {
        const k = Math.min(1, (performance.now() - t0) / 1400);
        conf = +(target * (1 - Math.pow(1 - k, 3))).toFixed(1);
        $('#au-conf', root).textContent = `${conf.toFixed(1)}%`;
        if (k < 1) requestAnimationFrame(tickAnim); else res();
      };
      tickAnim();
    });
    setStep('read', 'done');
    setCam('st-locked'); setStatus('lock', { conf: conf.toFixed(1) });
    await sleep(320);

    /* 03 — identity match */
    setStep('ident', 'doing'); setCam('st-verify'); setStatus('verify', { conf: conf.toFixed(1) });
    await sleep(620);

    if (!person) {
      setStep('ident', 'fail');
      setStep('perm', ''); setStep('grant', '');
      setCam('st-denied');
      setStatus('bad', { conf: conf.toFixed(1) });
      showDenied(conf);
      busy = false;
      $('#au-pick', root).style.opacity = '';
      $('#au-pick', root).style.pointerEvents = '';
      return;
    }
    setStep('ident', 'done');

    /* 04 — permission check */
    setStep('perm', 'doing');
    await sleep(560);
    setStep('perm', 'done');

    /* 05 — granted */
    setStep('grant', 'doing');
    setCam('st-granted');
    setStatus('ok', { conf: conf.toFixed(1) });
    showGranted(person, conf);
    await sleep(520);
    setStep('grant', 'done');

    await sleep(780);
    signIn(person.id, +conf.toFixed(1));
    root.classList.add('leaving');
    await sleep(340);
    stopFeed(); releaseStream();
    root.remove();
    onDone(person);
  }

  function showGranted(p, conf) {
    $('#au-result', root).innerHTML = `
      <div class="ident ok">
        ${avatar(p, 'av-lg')}
        <div class="id-tx">
          <div class="a">${esc(p.nome)}</div>
          <div class="b">${esc(p.funcao)} · ${esc(p.matricula)}</div>
        </div>
        <div style="text-align:right">
          <div>${levelTag(p.nivel)}</div>
          <div class="mono" style="font-size:10px;color:var(--tx-dim);margin-top:3px">${esc(unitName(p.unidade))}</div>
        </div>
      </div>
      <div class="row g-2" style="justify-content:center;margin-top:11px">
        <span class="badge b-ok badge-live"><i class="dot"></i>Acesso liberado</span>
        <span class="badge b-ac">Confiança ${conf.toFixed(1)}%</span>
      </div>`;
  }

  function showDenied(conf) {
    $('#au-result', root).innerHTML = `
      <div class="ident bad">
        <div class="av av-lg" style="background:rgba(240,87,77,.14);color:var(--risk);box-shadow:0 0 0 1px rgba(240,87,77,.3)">${icon('userX', 22)}</div>
        <div class="id-tx">
          <div class="a">Colaborador não identificado</div>
          <div class="b">Similaridade ${conf.toFixed(1)}% — abaixo do limiar de 92%</div>
        </div>
        <span class="badge b-risk"><i class="dot"></i>Bloqueado</span>
      </div>
      <div style="text-align:center;font-size:11.5px;color:var(--tx-lo);margin-top:10px">
        Registro enviado à central de alertas. Procure a supervisão de segurança.
      </div>`;
  }

  /* ---------- interactions ---------- */
  root.addEventListener('click', (e) => {
    const card = e.target.closest('[data-emp]');
    if (card) return identify(card.dataset.emp);
    if (e.target.closest('#au-unknown')) return identify(null);
  });

  /* Keyboard shortcut for a fast demo: Enter starts with the admin identity. */
  root.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !busy) identify(DEMO_FACES[0]); });

  return root;
}

return { renderAuth };
})();

/* ------------------------------------------------------------ */
function mount() {
  /* The operations centre keeps breathing: re-render on the simulation tick.
     The router calls the returned disposer when the user navigates away. */
  const isHere = () => {
    const h = location.hash.replace(/^#\/?/, '');
    return h === '' || h.startsWith('dashboard');
  };
  const t = setInterval(() => {
    if (!isHere() || document.querySelector('.overlay')) return;
    const view = document.querySelector('#view');
    const main = document.querySelector('#main');
    if (!view) return;
    const scroll = main?.scrollTop ?? 0;
    view.innerHTML = render();
    if (main) main.scrollTop = scroll;
  }, 6000);
  return () => clearInterval(t);
}

return { render, mount };
})();
