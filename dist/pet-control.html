        <button class="btn btn-sm btn-ok" data-res="${esc(a.id)}">${icon('check')} Tratar</button>
      </div>` : ''}
    </div>
  </article>`;
}

/* ------------------------------------------------------------ */
function mount(root) {
  const page = root.querySelector('.page');
  if (!page) return null;

  const repaint = () => {
    const view = document.querySelector('#view');
    const scroll = document.querySelector('#main')?.scrollTop ?? 0;
    view.innerHTML = render();
    mount(view);
    const m = document.querySelector('#main'); if (m) m.scrollTop = scroll;
  };

  $('#al-q', root)?.addEventListener('input', debounce((e) => {
    f.q = e.target.value; repaint();
    const el = $('#al-q'); el?.focus(); el?.setSelectionRange(el.value.length, el.value.length);
  }, 240));
  ['status', 'sev', 'tipo'].forEach((k) => {
    $(`#al-${k}`, root)?.addEventListener('change', (e) => { f[k] = e.target.value; repaint(); });
  });

  on(page, 'click', '[data-ack]', (e, t) => {
    ackAlert(t.dataset.ack);
    toast('Alerta assumido', `Tratativa iniciada por ${me()?.nome.split(' ')[0]}.`, 'info');
    repaint();
  });
  on(page, 'click', '[data-res]', (e, t) => {
    resolveAlert(t.dataset.res);
    toast('Alerta tratado', 'A conclusão foi registrada na trilha de auditoria.', 'ok');
    repaint();
  });

  $('#al-all', root)?.addEventListener('click', () => {
    const abertos = alertsInScope().filter((a) => a.status !== 'RESOLVIDO');
    confirm({
      title: 'Tratar todos os alertas',
      confirmLabel: `Tratar ${abertos.length}`,
      message: `${abertos.length} ocorrência(s) serão marcadas como tratadas em seu nome. Cada tratativa é registrada individualmente na auditoria.`,
      onConfirm: () => {
        abertos.forEach((a) => resolveAlert(a.id));
        toast('Alertas tratados', `${abertos.length} ocorrências concluídas.`, 'ok');
        repaint();
      },
    });
  });

  $('#al-export', root)?.addEventListener('click', () => {
    const rows = filtered();
    downloadText(`alertas-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, [
      { label: 'Data/hora', get: (a) => dtFull(a.ts) },
      { label: 'Tipo', get: (a) => ALERTA_TIPOS[a.tipo]?.label ?? a.tipo },
      { label: 'Severidade', get: (a) => SEV[a.sev]?.label ?? a.sev },
      { label: 'Título', get: (a) => a.titulo },
      { label: 'Descrição', get: (a) => a.descricao },
      { label: 'Área', get: (a) => areaName(a.areaId) },
      { label: 'Unidade', get: (a) => unitName(a.unidade) },
      { label: 'PET', get: (a) => pet(a.petId)?.codigo ?? '' },
      { label: 'Status', get: (a) => a.status },
      { label: 'Tratado por', get: (a) => emp(a.resolvidoPorId)?.nome ?? '' },
    ])).then((ok) => {
      if (ok) toast('Exportação concluída', `${rows.length} alertas exportados.`, 'ok');
    });
  });

  return null;
}

return { render, mount };
})();

/* ---------- src/screens/rastreabilidade.js ---------- */
const M_screens_rastreabilidade = (() => {
/**
 * PET CONTROL — Rastreabilidade.
 *
 * The differentiator: every operational fact is recorded as
 * QUEM + O QUÊ + QUANDO + ONDE + STATUS, and can be replayed as a timeline
 * for a single permit or queried across the whole operation.
 */

const { esc, hhmm, dtFull, dur, ago, matches, on, $, debounce, toCSV, downloadText } = M_util;
const { icon } = M_ui_icons;
const { avatar, panel, empty, petBadge, searchBox, selectBox } = M_ui_kit;
const { toast } = M_ui_overlay;
const { state, emp, pet } = M_store;
const { petsInScope, eventsInScope, timelineOf } = M_selectors;
const { EVENTO, eventoLabel, areaName, unitName, atividadeNome } = M_data_catalog;
const f = { pet: null, q: '', tipo: 'TODOS', ator: 'TODOS' };

function render(params = []) {
  const pets = petsInScope().sort((a, b) => b.criadaEm - a.criadaEm);
  /* Default to the permit with the richest history, so the timeline opens
     on a full lifecycle rather than an arbitrary record. */
  const alvoId = params[0] ?? f.pet ?? maisCompleta(pets)?.id ?? pets[0]?.id;
  const alvo = pet(alvoId) ?? pets[0] ?? null;
  f.pet = alvo?.id ?? null;

  return `<div class="page">
    <div class="page-hd">
      <div>
        <div class="crumbs">${icon('trace')} Monitoramento ${icon('chevR')} Rastreabilidade</div>
        <h1>Rastreabilidade</h1>
        <p class="lead">
          Cada ação sobre uma permissão gera um registro com autor, natureza, momento, local e situação.
          O histórico completo substitui o arquivo físico e sustenta a auditoria.
        </p>
      </div>
      <div class="acts">
        <span class="badge b-ac">${icon('db', 11)} ${state.events.length.toLocaleString('pt-BR')} eventos registrados</span>
        <button class="btn btn-outline" id="rt-export">${icon('download')} Exportar trilha</button>
      </div>
    </div>

    <div class="grid g-split">
      <aside class="panel">
        <header class="panel-hd"><h3>Permissões</h3></header>
        <div class="toolbar" style="padding:10px 12px">
          ${searchBox('rt-pq', 'Buscar PET…', '')}
        </div>
        <div class="feed" id="rt-list" style="max-height:620px;overflow-y:auto">
          ${petList(pets, alvo)}
        </div>
      </aside>

      <div class="col g-4" id="rt-detail">
        ${alvo ? timelineHTML(alvo) : empty('Selecione uma permissão', 'Escolha uma PET à esquerda para ver o histórico.', 'trace')}
        ${globalHTML()}
      </div>
    </div>
  </div>`;
}

/** The permit whose audit trail tells the most complete story. */
function maisCompleta(pets) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const candidatas = pets.filter((p) => p.criadaEm >= hoje.getTime());
  const pool = candidatas.length ? candidatas : pets;
  return pool.slice().sort((a, b) => timelineOf(b.id).length - timelineOf(a.id).length)[0] ?? null;
}

function petList(pets, alvo, q = '') {
  const rows = pets.filter((p) => matches(q, p.codigo, p.titulo, areaName(p.areaId))).slice(0, 60);
  if (!rows.length) return empty('Nada encontrado', '', 'permit');
  return rows.map((p) => `<button class="feed-row" data-pet="${esc(p.id)}" style="text-align:left;width:100%;${
    alvo && p.id === alvo.id ? 'background:var(--bg-active);box-shadow:inset 2px 0 0 var(--ac)' : ''}">
    <div class="feed-bd">
      <div class="row-b g-2">
        <span class="mono" style="font-size:11.5px;color:var(--ac)">${esc(p.codigo)}</span>
        ${petBadge(p.status)}
      </div>
      <div class="feed-t truncate" style="margin-top:3px">${esc(p.titulo)}</div>
      <div class="feed-s">${esc(areaName(p.areaId))} · ${timelineOf(p.id).length} eventos</div>
    </div>
  </button>`).join('');
}

/* ------------------------------------------------------------ */
function timelineHTML(p) {
  const ev = timelineOf(p.id);
  const inicio = ev[0]?.ts ?? p.criadaEm;
  const fim = ev[ev.length - 1]?.ts ?? Date.now();
  const atores = new Set(ev.map((e) => e.atorId).filter(Boolean));

  return `<section class="panel panel-rail">
    <header class="panel-hd">
      <div>
        <h3>Histórico completo · ${esc(p.codigo)}</h3>
        <div class="sub">${esc(p.titulo)} — ${esc(atividadeNome(p.tipo))}</div>
      </div>
      <div class="row g-2">
        ${petBadge(p.status, true)}
        <a class="btn btn-sm btn-outline" href="#/pets/${esc(p.id)}">${icon('ext')} Abrir PET</a>
      </div>
    </header>

    <div class="panel-bd" style="padding-bottom:8px">
      <div class="grid g-4c" style="gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;margin-bottom:22px">
        ${[['Eventos', ev.length, 'registros na trilha'],
           ['Ciclo total', dur(inicio, fim), 'da criação ao encerramento'],
           ['Pessoas envolvidas', atores.size, 'autores identificados'],
           ['Área', areaName(p.areaId), unitName(p.unidade)]]
          .map(([l, v, s]) => `<div style="background:var(--bg-inset);padding:13px 15px">
            <div class="eyebrow">${esc(l)}</div>
            <div style="font-family:var(--f-mono);font-size:17px;color:var(--tx-hi);margin-top:5px;font-weight:600">${esc(String(v))}</div>
            <div style="font-size:10.5px;color:var(--tx-dim);margin-top:2px">${esc(s)}</div>
          </div>`).join('')}
      </div>

      <ul class="tl">${ev.map((e, i) => {
        const meta = EVENTO[e.tipo] ?? { label: e.tipo, icon: 'info', tone: '' };
        const ator = e.atorId ? emp(e.atorId) : null;
        const ultimo = i === ev.length - 1;
        return `<li class="tl-item ${meta.tone || (ultimo ? 'on' : '')}">
          <div class="row-b wrap g-3">
            <div class="row g-2" style="align-items:baseline">
              <span style="color:var(--tx-mid);display:inline-flex;margin-right:2px">${icon(meta.icon, 13)}</span>
              <span class="tl-t">${esc(meta.label)}</span>
              <span class="tl-time">${esc(hhmm(e.ts))}</span>
            </div>
            <span class="mono" style="font-size:10px;color:var(--tx-dim)">${esc(e.id)}</span>
          </div>
          ${e.detalhe ? `<div style="font-size:12.5px;color:var(--tx);margin-top:4px">${esc(e.detalhe)}</div>` : ''}
          <div class="tl-meta">
            <span title="Quem">${icon('userCheck', 11)} ${esc(ator?.nome ?? 'Sistema automatizado')}</span>
            <span title="Onde">${icon('pin', 11)} ${esc(areaName(e.areaId))}</span>
            <span title="Quando">${icon('clock', 11)} ${esc(dtFull(e.ts))}</span>
            <span title="Status">${icon('shield', 11)} registro selado</span>
          </div>
        </li>`;
      }).join('')}</ul>
    </div>

    <footer class="panel-ft">
      <span class="row g-2" style="font-size:11.5px;color:var(--tx-lo)">
        ${icon('lock', 12)} Registros somente-leitura — não podem ser editados nem excluídos pela operação.
      </span>
      <span class="mono" style="font-size:10.5px;color:var(--tx-dim)">
        Selo de integridade ${esc(hashOf(p.id + ev.length))}
      </span>
    </footer>
  </section>`;
}

/** Cosmetic integrity seal — communicates immutability in the demo. */
function hashOf(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).padStart(8, '0').toUpperCase().replace(/(.{4})/, '$1·');
}

/* ------------------------------------------------------------ */
function globalHTML() {
  const rows = globalRows();
  const atores = [...new Set(state.events.map((e) => e.atorId).filter(Boolean))]
    .map(emp).filter(Boolean).sort((a, b) => a.nome.localeCompare(b.nome)).slice(0, 40);

  return `<section class="panel">
    <header class="panel-hd">
      <div><h3>Trilha de auditoria global</h3><div class="sub">Todos os eventos da operação, filtráveis e exportáveis</div></div>
    </header>
    <div class="toolbar">
      ${searchBox('rt-q', 'Buscar por detalhe, autor, PET ou área…', f.q)}
      ${selectBox('rt-tipo', [{ value: 'TODOS', label: 'Todos os eventos' },
        ...Object.entries(EVENTO).map(([k, v]) => ({ value: k, label: v.label }))], f.tipo)}
      ${selectBox('rt-ator', [{ value: 'TODOS', label: 'Todos os autores' }, { value: 'SISTEMA', label: 'Sistema automatizado' },
        ...atores.map((e) => ({ value: e.id, label: e.nome }))], f.ator)}
      <div class="grow"></div>
      <span class="mono" style="font-size:11px;color:var(--tx-dim)">${rows.length} eventos</span>
    </div>
    <div class="tbl-wrap">
      ${rows.length ? `<table class="tbl">
        <thead><tr><th>Quando</th><th>Quem</th><th>O quê</th><th>Detalhe</th><th>Onde</th><th>PET</th><th class="right">Registro</th></tr></thead>
        <tbody>${rows.slice(0, 60).map((e) => {
          const ator = e.atorId ? emp(e.atorId) : null;
          const meta = EVENTO[e.tipo] ?? { label: e.tipo, icon: 'info', tone: '' };
          const p = pet(e.petId);
          const tone = meta.tone === 'risk' ? 'var(--risk)' : meta.tone === 'warn' ? 'var(--warn)' : meta.tone === 'ok' ? 'var(--ok)' : 'var(--tx-mid)';
          return `<tr>
            <td class="mono nowrap" style="font-size:11.5px">${esc(dtFull(e.ts))}
              <div style="font-size:10px;color:var(--tx-dim)">${esc(ago(e.ts))}</div></td>
            <td>${ator ? `<div class="row g-2">${avatar(ator, 'av-sm')}<span class="truncate" style="max-width:120px">${esc(ator.nome)}</span></div>`
              : `<span class="row g-2" style="color:var(--tx-lo)">${icon('cpu', 13)} Sistema</span>`}</td>
            <td class="nowrap"><span class="row g-2" style="color:${tone}">${icon(meta.icon, 13)} <span style="color:var(--tx-hi)">${esc(meta.label)}</span></span></td>
            <td class="truncate" style="max-width:280px;font-size:11.5px;color:var(--tx-lo)">${esc(e.detalhe || '—')}</td>
            <td class="nowrap">${esc(areaName(e.areaId))}</td>
            <td class="mono" style="font-size:11px;color:${p ? 'var(--ac)' : 'var(--tx-dim)'}">${esc(p?.codigo ?? '—')}</td>
            <td class="right mono" style="font-size:10px;color:var(--tx-dim)">${esc(e.id)}</td>
          </tr>`;
        }).join('')}</tbody></table>` : empty('Nenhum evento', 'Ajuste os filtros da trilha.', 'trace')}
    </div>
  </section>`;
}

function globalRows() {
  return eventsInScope().filter((e) => {
    if (f.tipo !== 'TODOS' && e.tipo !== f.tipo) return false;
    if (f.ator === 'SISTEMA' && e.atorId) return false;
    if (f.ator !== 'TODOS' && f.ator !== 'SISTEMA' && e.atorId !== f.ator) return false;
    return matches(f.q, e.detalhe ?? '', emp(e.atorId)?.nome ?? '', eventoLabel(e.tipo), areaName(e.areaId), pet(e.petId)?.codigo ?? '');
  });
}

/* ------------------------------------------------------------ */
function mount(root, params = []) {
  const page = root.querySelector('.page');
  if (!page) return null;

  const repaint = () => {
    const view = document.querySelector('#view');
    const scroll = document.querySelector('#main')?.scrollTop ?? 0;
    view.innerHTML = render(f.pet ? [f.pet] : []);
    mount(view, f.pet ? [f.pet] : []);
    const m = document.querySelector('#main'); if (m) m.scrollTop = scroll;
  };

  on(page, 'click', '[data-pet]', (e, t) => { f.pet = t.dataset.pet; repaint(); });

  $('#rt-pq', root)?.addEventListener('input', debounce((e) => {
    const q = e.target.value;
    const pets = petsInScope().sort((a, b) => b.criadaEm - a.criadaEm);
    $('#rt-list').innerHTML = petList(pets, pet(f.pet), q);
  }, 200));

  $('#rt-q', root)?.addEventListener('input', debounce((e) => {
    f.q = e.target.value; repaint();
    const el = $('#rt-q'); el?.focus(); el?.setSelectionRange(el.value.length, el.value.length);
  }, 250));
  $('#rt-tipo', root)?.addEventListener('change', (e) => { f.tipo = e.target.value; repaint(); });
  $('#rt-ator', root)?.addEventListener('change', (e) => { f.ator = e.target.value; repaint(); });

  $('#rt-export', root)?.addEventListener('click', () => {
    const rows = globalRows();
    downloadText(`trilha-auditoria-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, [
      { label: 'Registro', get: (e) => e.id },
      { label: 'Quando', get: (e) => dtFull(e.ts) },
      { label: 'Quem', get: (e) => emp(e.atorId)?.nome ?? 'Sistema automatizado' },
      { label: 'O quê', get: (e) => eventoLabel(e.tipo) },
      { label: 'Detalhe', get: (e) => e.detalhe ?? '' },
      { label: 'Onde', get: (e) => areaName(e.areaId) },
      { label: 'Unidade', get: (e) => unitName(e.unidade) },
      { label: 'PET', get: (e) => pet(e.petId)?.codigo ?? '' },
    ])).then((ok) => {
      if (ok) toast('Trilha exportada', `${rows.length} eventos exportados para auditoria.`, 'ok');
    });
  });

  return null;
}

return { render, mount };
})();

          </tr>`).join('')}</tbody>
        </table>` : empty('Nenhuma permissão no filtro', 'Amplie o período ou remova filtros.', 'report')}
      </div>
    </section>
  </div>`;
}

/* ------------------------------------------------------------ */
function mount(root) {
  const page = root.querySelector('.page');
  if (!page) return null;

  const repaint = () => {
    const view = document.querySelector('#view');
    const scroll = document.querySelector('#main')?.scrollTop ?? 0;
    view.innerHTML = render();
    mount(view);
    const m = document.querySelector('#main'); if (m) m.scrollTop = scroll;
  };

  const bind = (id, key, num = false) => $(id, root)?.addEventListener('change', (e) => {
    f[key] = num ? Number(e.target.value) : e.target.value;
    if (key === 'unidade') f.areaId = 'TODAS';
    repaint();
  });
  bind('#rp-dias', 'dias', true);
  bind('#rp-unidade', 'unidade');
  bind('#rp-area', 'areaId');
  bind('#rp-tipo', 'tipo');
  bind('#rp-emp', 'empId');
  bind('#rp-status', 'status');

  $('#rp-clear', root)?.addEventListener('click', () => {
    Object.assign(f, { dias: 30, unidade: 'TODAS', areaId: 'TODAS', tipo: 'TODAS', empId: 'TODOS', status: 'TODOS' });
    repaint();
    toast('Filtros limpos', 'Exibindo os últimos 30 dias de todas as unidades.', 'info', 2400);
  });

  on(page, 'click', '[data-pet]', (e, t) => { location.hash = `#/pets/${t.dataset.pet}`; });

  $('#rp-csv', root)?.addEventListener('click', () => {
    const r = reportData({ de: Date.now() - f.dias * DAY, ate: Date.now(), unidade: f.unidade, areaId: f.areaId, tipo: f.tipo, empId: f.empId, status: f.status });
    downloadText(`relatorio-pets-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(r.pets, [
      { label: 'Código', get: (p) => p.codigo },
      { label: 'Título', get: (p) => p.titulo },
      { label: 'Atividade', get: (p) => atividadeNome(p.tipo) },
      { label: 'Unidade', get: (p) => unitName(p.unidade) },
      { label: 'Área', get: (p) => areaName(p.areaId) },
      { label: 'Responsável', get: (p) => emp(p.responsavelId)?.nome ?? '' },
      { label: 'Equipe', get: (p) => p.equipe.length },
      { label: 'Status', get: (p) => PET_STATUS[p.status]?.label ?? p.status },
      { label: 'Criada em', get: (p) => dtFull(p.criadaEm) },
      { label: 'Aprovação (min)', get: (p) => (p.validadaEm ? Math.round((p.validadaEm - p.criadaEm) / 60000) : '') },
      { label: 'Duração (h)', get: (p) => (p.iniciadaEm && p.encerradaEm ? ((p.encerradaEm - p.iniciadaEm) / 3600000).toFixed(1) : '') },
    ])).then((ok) => {
      if (ok) toast('Relatório exportado', `${r.pets.length} permissões em CSV.`, 'ok');
    });
  });

  $('#rp-print', root)?.addEventListener('click', () => {
    toast('Preparando impressão', 'O relatório será enviado ao diálogo de impressão.', 'info', 2000);
    setTimeout(() => window.print(), 400);
  });

  return null;
}

return { render, mount };
})();

function mount(root) {
  $('#cf-sim', root)?.addEventListener('change', (e) => {
    setUI({ simulacao: e.target.checked });
    if (e.target.checked) startSimulation();
    toast(e.target.checked ? 'Monitoramento ativado' : 'Monitoramento pausado',
      e.target.checked ? 'Sensores e eventos voltam a atualizar em tempo real.' : 'Os dados permanecem estáticos até ser reativado.',
      e.target.checked ? 'ok' : 'info', 2800);
  });

  $('#cf-nav', root)?.addEventListener('change', (e) => {
    setUI({ navCollapsed: e.target.checked });
    document.querySelector('#shell')?.classList.toggle('nav-collapsed', e.target.checked);
  });

  $('#cf-unidade', root)?.addEventListener('change', (e) => {
    setUI({ unidade: e.target.value });
    toast('Escopo atualizado', 'Indicadores e listagens foram recalculados.', 'info', 2400);
  });

  $('#cf-reset', root)?.addEventListener('click', () => {
    confirm({
      title: 'Restaurar demonstração', tone: 'risk', confirmLabel: 'Restaurar tudo',
      message: 'Toda a operação simulada será recriada: permissões, acessos, alertas e trilha de auditoria voltam ao estado inicial. Sua sessão permanece ativa.',
      onConfirm: () => {
        const s = state.session;
        resetDemo();
        state.session = s;
        toast('Demonstração restaurada', 'A base foi regenerada com o horário atual.', 'ok');
        location.hash = '#/dashboard';
      },
    });
  });

  return null;
}

return { render, mount };
})();

/* ============================================================
   ROUTER
   ============================================================ */
let current = null;
let disposeScreen = null;

async function navigate() {
  const raw = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const [id, ...rest] = raw.split('/');
  const route = routeById(id) ?? routeById('dashboard');

  if (route.cap && !allow(route.cap)) {
    $('#view').innerHTML = deniedHTML(route);
    $$('.nav-item').forEach((n) => n.classList.remove('on'));
    return;
  }

  const view = $('#view');
  view.innerHTML = `<div class="page"><div class="skeleton" style="height:78px;border-radius:12px"></div>
    <div class="grid g-kpi" style="margin-top:16px">${'<div class="skeleton" style="height:108px;border-radius:12px"></div>'.repeat(5)}</div>
    <div class="skeleton" style="height:300px;border-radius:12px;margin-top:16px"></div></div>`;

  try {
    disposeScreen?.();
    disposeScreen = null;
    const mod = await route.mod();
    current = { route, params: rest };
    view.innerHTML = mod.render(rest);
    disposeScreen = mod.mount?.(view, rest) ?? null;
    $('#main').scrollTop = 0;
  } catch (err) {
    console.error(err);
    view.innerHTML = `<div class="page"><div class="panel"><div class="panel-bd">
      <div class="empty">${icon('warnCircle')}<div class="t">Não foi possível carregar esta tela</div>
      <div class="s">${esc(err.message)}</div></div></div></div></div>`;
  }
  renderNav();
}

function deniedHTML(route) {
  const u = me();
  return `<div class="page"><div class="panel" style="max-width:560px;margin:60px auto">
    <div class="panel-bd" style="text-align:center;padding:44px 32px">
      <div style="width:54px;height:54px;border-radius:14px;background:rgba(240,87,77,.1);color:var(--risk);display:grid;place-items:center;margin:0 auto 18px">${icon('lock', 24)}</div>
      <h2 style="font-size:17px">Acesso restrito</h2>
      <p style="font-size:12.5px;color:var(--tx-lo);margin-top:9px;line-height:1.6">
        A área <strong style="color:var(--tx-hi)">${esc(route.label)}</strong> não está disponível para o nível
        <strong style="color:var(--tx-hi)">${esc(NIVEIS[u?.nivel]?.label ?? '—')}</strong>.<br>
        Solicite elevação de permissão à coordenação de SSMA.
      </p>
      <a class="btn btn-primary" href="#/dashboard" style="margin-top:20px">${icon('dashboard')} Voltar ao dashboard</a>
    </div></div></div>`;
}

function mountShell() {

  app.innerHTML = shellHTML();

  renderNav(); renderTopUser(); renderTopUnit(); renderBell(); renderSensorStatus();
  startClock();

  $('#btn-nav').addEventListener('click', () => {
    setUI({ navCollapsed: !state.ui.navCollapsed });

  });
  $('#btn-bell').addEventListener('click', openNotifications);
  $('#btn-user').addEventListener('click', openUserMenu);
  $('#btn-unit').addEventListener('click', openUnitPicker);

  window.addEventListener('hashchange', navigate);

  subscribe((s, reason) => {
    renderNav(); renderBell(); renderTopUnit(); renderSensorStatus();
    if (reason === 'ui' || reason === 'reset') navigate();
  });

  startSimulation();
  navigate();
}

let booted = false;
function boot(force = false) {
  if (booted && !force) return;
  booted = true;
  const app = $('#app');
  if (!state.session) {
    app.innerHTML = '';
    renderAuth((person) => {
      booted = true;
      mountShell();
      setTimeout(() => toast(
        `Bem-vindo(a), ${person.nome.split(' ')[0]}`,
        `Sessão iniciada por reconhecimento facial · nível ${NIVEIS[person.nivel].label}.`, 'ok', 5200), 380);
    });
    return;
  }
  mountShell();
}

/* global helpers used by screens */

window.addEventListener('hashchange', () => { if (state.session) renderNav(); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot());
else boot();

return { boot, ROUTES, routeById };
})();
