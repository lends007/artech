/* ---------- 02 ---------- */
function paneEquipe() {
  /* Operators already authorised for the chosen area come first: picking them
     is what keeps the released PET consistent with the turnstile rules. */
  const habilitado = (e) => e.status === 'ATIVO' && e.face
    && (!D.areaId || e.areas.includes(D.areaId))
    && !(e.treinamentos ?? []).some((t) => t.validade < Date.now());

  const disponiveis = state.employees
    .filter((e) => e.nivel === 'OPERADOR' || e.nivel === 'SUPERVISOR')
    .filter((e) => matches(teamQuery, e.nome, e.funcao, e.matricula))
    .sort((a, b) => Number(habilitado(b)) - Number(habilitado(a)))
    .slice(0, 40);

  const selecionados = D.equipe.map((m) => ({ ...m, e: emp(m.empId) })).filter((x) => x.e);
  const bloqueios = selecionados.filter((x) => x.e.status !== 'ATIVO' || !x.e.face
    || (D.areaId && !x.e.areas.includes(D.areaId))
    || (x.e.treinamentos ?? []).some((t) => t.validade < Date.now()));

  return `<div class="wiz-pane grid g-2" style="gap:20px;align-items:start">
    <div>
      <div class="eyebrow" style="margin-bottom:10px">Colaboradores disponíveis</div>
      <div class="search" style="margin-bottom:10px">${icon('search')}
        <input id="f-team-q" type="search" placeholder="Buscar por nome, função ou matrícula…" value="${esc(teamQuery)}">
      </div>
      <div class="col g-1" style="max-height:390px;overflow-y:auto;padding-right:4px">
        ${disponiveis.map((e) => {
          const on_ = D.equipe.some((m) => m.empId === e.id);
          const impedido = !habilitado(e);
          return `<button class="pick ${on_ ? 'on' : ''}" data-emp="${e.id}" style="padding:9px 11px">
            <span class="pk-box">${icon('check')}</span>
            ${avatar(e, 'av-sm')}
            <span class="grow" style="min-width:0">
              <span class="pk-t truncate">${esc(e.nome)}</span>
              <span class="pk-s truncate">${esc(e.funcao)} · ${esc(e.matricula)}</span>
            </span>
            ${impedido ? `<span class="badge b-warn nowrap" style="flex:none">${esc(motivoCurto(e))}</span>` : ''}
          </button>`;
        }).join('') || empty('Nenhum colaborador encontrado', '', 'users')}
      </div>
    </div>

    <div>
      <div class="row-b" style="margin-bottom:10px">
        <div class="eyebrow">Equipe da permissão</div>
        <span class="badge ${D.equipe.length ? 'b-ac' : 'b-idle'}">${D.equipe.length} selecionado(s)</span>
      </div>
      ${selecionados.length ? `<div class="col g-2">${selecionados.map((x, i) => `
        <div class="panel panel-inset" style="padding:10px 12px">
          <div class="row-b g-3">
            <div class="row g-3" style="min-width:0">
              ${avatar(x.e, 'av-sm')}
              <div style="min-width:0">
                <div class="truncate" style="font-size:12.5px;color:var(--tx-hi)">${esc(x.e.nome)}</div>
                <div style="font-size:10.5px;color:var(--tx-dim)">${esc(x.e.funcao)}</div>
              </div>
            </div>
            <div class="row g-2" style="flex:none">
              <select class="sel" data-papel="${x.empId}" style="height:28px;width:auto;font-size:11.5px;min-width:130px">
                ${['Executante líder', 'Executante', 'Vigia', 'Observador de segurança', 'Sinaleiro'].map((pp) =>
                  `<option ${x.papel === pp ? 'selected' : ''}>${pp}</option>`).join('')}
              </select>
              <button class="btn btn-sm btn-ghost" data-rm="${x.empId}">${icon('x')}</button>
            </div>
          </div>
        </div>`).join('')}</div>`
        : empty('Nenhum colaborador vinculado', 'Selecione ao menos um executante à esquerda.', 'users')}

      ${bloqueios.length ? `<div class="panel" style="margin-top:12px;border-color:rgba(245,176,44,.35);background:rgba(245,176,44,.05)">
        <div class="panel-bd" style="padding:12px 14px">
          <div class="row g-2" style="color:var(--warn);font-size:12px;font-weight:600">${icon('warnCircle', 14)} ${bloqueios.length} pendência(s) de habilitação</div>
          <ul class="col g-1" style="margin-top:8px">${bloqueios.map((b) => `<li style="font-size:11.5px;color:var(--tx-lo)">
            <strong style="color:var(--tx)">${esc(b.e.nome)}</strong> — ${esc(motivoBloqueio(b.e))}</li>`).join('')}</ul>
          <div style="font-size:11px;color:var(--tx-dim);margin-top:8px">
            O sistema bloqueará o acesso físico destes colaboradores mesmo com a PET liberada.
          </div>
        </div></div>` : ''}
    </div>
  </div>`;
}

/** Short label for the blocking reason, shown on the picker row. */
function motivoCurto(e) {
  if (!e.face) return 'sem face';
  if (e.status !== 'ATIVO') return e.status.toLowerCase();
  if ((e.treinamentos ?? []).some((t) => t.validade < Date.now())) return 'NR vencida';
  return 'fora da área';
}

function motivoBloqueio(e) {
  if (!e.face) return 'sem registro facial ativo';
  if (e.status === 'AFASTADO') return 'colaborador afastado';
  if (e.status === 'PENDENTE') return 'cadastro pendente de regularização';
  const v = (e.treinamentos ?? []).find((t) => t.validade < Date.now());
  if (v) return `treinamento vencido — ${v.nome}`;
  if (D.areaId && !e.areas.includes(D.areaId)) return `sem autorização para ${areaName(D.areaId)}`;
  return 'pendência de habilitação';
}

function paneRiscos() {

        return `<label class="pick ${marcado ? 'on' : ''}" data-check="${c.id}" style="cursor:pointer">
          <span class="pk-box">${icon('check')}</span>
          <span class="grow">
            <span class="pk-t">${esc(c.label)}</span>

          </span>
          ${a === false ? '<span class="badge b-risk" style="flex:none">pendente</span>' : a === true ? '<span class="badge b-ok" style="flex:none">auto</span>' : ''}
        </label>`;
      }).join('')}
    </div>
  </div>`;
}

function autoChecks() {
  const equipeOk = D.equipe.length > 0 && D.equipe.every((m) => {
    const e = emp(m.empId);
    return e && e.status === 'ATIVO' && e.face && !(e.treinamentos ?? []).some((t) => t.validade < Date.now());
  });
  const params = atividadeById(D.tipo)?.params ?? [];
  const medOk = params.length > 0 && params.every((p) => D.medicoes[p] != null && classify(p, Number(D.medicoes[p])) !== 'risk');
  return {
    equipe: equipeOk,
    medicoes: medOk,
    riscos: D.riscos.length > 0,
    medidas: D.riscos.length > 0 || D.medidasExtra.trim().length > 0,
    epis: D.epis.length > 0,
  };
}

/* ---------- 07 ---------- */
function paneLiber() {
  const ativ = atividadeById(D.tipo);
  const team = D.equipe.map((m) => ({ ...m, e: emp(m.empId) })).filter((x) => x.e);
  const params = ativ?.params ?? [];
  const problemas = validateAll();

  const sec = (n, t, inner) => `<div class="review-sec">
    <div class="rs-hd"><span class="t">${n} — ${esc(t)}</span></div><div class="rs-bd">${inner}</div></div>`;

  return `<div class="wiz-pane col g-4">
    ${problemas.length ? `<div class="panel" style="border-color:rgba(240,87,77,.4);background:rgba(240,87,77,.05)">
      <div class="panel-bd" style="padding:14px 16px">

        <ul class="col g-1" style="margin-top:8px">${problemas.map((p) => `<li style="font-size:12px;color:var(--tx-lo)">• ${esc(p)}</li>`).join('')}</ul>
      </div></div>`
      : `<div class="panel" style="border-color:rgba(45,212,167,.35);background:rgba(45,212,167,.05)">
        <div class="panel-bd" style="padding:14px 16px">
          <div class="row g-2" style="color:var(--ok);font-size:12.5px;font-weight:600">${icon('shieldOk', 15)} Permissão pronta para emissão</div>
          <div style="font-size:12px;color:var(--tx-lo);margin-top:5px">

            ${allow('pet.validate') ? 'Ao liberar, a atividade fica autorizada e o acesso da equipe é habilitado nas portarias.' : 'A permissão será enviada para validação de um gestor.'}
          </div>
        </div></div>`}

    ${sec('01', 'Identificação', `<dl class="kv">
      <dt>Atividade</dt><dd>${esc(atividadeNome(D.tipo) || '—')}</dd>
      <dt>Descrição</dt><dd>${esc(D.titulo || '—')}</dd>
      <dt>Local</dt><dd>${esc(D.local || '—')} — ${esc(areaName(D.areaId) || '—')}, ${esc(unitName(D.unidade))}</dd>
      <dt>Responsável</dt><dd>${esc(emp(D.responsavelId)?.nome ?? '—')}</dd>
      <dt>Validade</dt><dd class="mono">${D.duracaoH}h a partir da liberação</dd></dl>`)}

    ${sec('02', `Equipe (${team.length})`, team.length ? `<div class="col g-2">${team.map((x) => `
      <div class="row-b"><span class="row g-2" style="font-size:12.5px;color:var(--tx-hi)">${avatar(x.e, 'av-sm')} ${esc(x.e.nome)}</span>
      <span style="font-size:11.5px;color:var(--tx-lo)">${esc(x.papel)}</span></div>`).join('')}</div>` : '<span class="t-lo">Nenhum colaborador vinculado.</span>')}

    ${sec('03', `Riscos (${D.riscos.length}) e medidas`, D.riscos.length
      ? `<div class="row g-2 wrap" style="margin-bottom:10px">${D.riscos.map((r) => `<span class="chip">${icon('alert', 12)} ${esc(riscoNome(r))}</span>`).join('')}</div>
         <div style="font-size:12px;color:var(--tx-lo);line-height:1.6">${esc(collectMedidas().join(' · ')) || '—'}</div>`
      : '<span class="t-lo">Nenhum risco avaliado.</span>')}

    ${sec('04', 'Medições', params.length ? `<div class="grid g-auto">${params.map((pid) =>
      D.medicoes[pid] != null && D.medicoes[pid] !== ''
        ? gaugeCard(pid, Number(D.medicoes[pid]), { compact: true })
        : `<div class="gauge-card"><div class="g-lbl">${esc(PARAMS[pid].nome)}</div>
           <div class="row-b" style="margin-top:8px"><span class="g-val">—</span><span class="badge b-idle">pendente</span></div></div>`
    ).join('')}</div>` : '<span class="t-lo">—</span>')}

    ${sec('05', 'Recursos', `<div class="row g-2 wrap">
      ${[...D.epis.map(epiNome), ...D.equipamentos, ...D.ferramentas].map((x) => `<span class="chip">${esc(x)}</span>`).join('') || '<span class="t-lo">—</span>'}
    </div>`)}

    ${sec('06', 'Checklist de segurança', `<div class="col g-2">${CHECKLIST.map((c) => {
      const ok = D.checklist[c.id] ?? (c.auto ? autoChecks()[c.auto] === true : false);
      return `<div class="row g-2" style="font-size:12.5px;color:${ok ? 'var(--tx)' : 'var(--tx-dim)'}">
        <span style="color:${ok ? 'var(--ok)' : 'var(--tx-dim)'};display:flex">${icon(ok ? 'okCircle' : 'xCircle', 14)}</span>${esc(c.label)}</div>`;
    }).join('')}</div>`)}
  </div>`;
}

function collectMedidas() {
  const base = D.riscos.flatMap((r) => RISCOS[r]?.medidas ?? []);
  const extra = D.medidasExtra.split('\n').map((s) => s.trim()).filter(Boolean);
  return [...new Set([...base, ...extra])];
}

/* ============================================================
   VALIDATION
   ============================================================ */
function validateStep(i) {
  const e = [];
  if (i === 0) {
    if (!D.tipo) e.push('Selecione o tipo de atividade.');
    if (D.titulo.trim().length < 5) e.push('Descreva a atividade (mínimo 5 caracteres).');
    if (!D.areaId) e.push('Selecione a área.');
    if (D.local.trim().length < 3) e.push('Informe o local específico.');
    if (!D.responsavelId) e.push('Defina o responsável pela permissão.');
  }
  if (i === 1 && !D.equipe.length) e.push('Vincule ao menos um colaborador à equipe.');
  if (i === 2 && !D.riscos.length) e.push('Selecione ao menos um risco identificado.');
  if (i === 3) {
    const params = atividadeById(D.tipo)?.params ?? [];
    const faltando = params.filter((p) => D.medicoes[p] == null || D.medicoes[p] === '');
    if (faltando.length) e.push(`Registre as medições pendentes: ${faltando.map((p) => PARAMS[p].nome).join(', ')}.`);
  }
  if (i === 4 && !D.epis.length) e.push('Selecione os EPIs obrigatórios.');
  if (i === 5) {
    const auto = autoChecks();
    const pend = CHECKLIST.filter((c) => !(D.checklist[c.id] ?? (c.auto ? auto[c.auto] === true : false)));
    if (pend.length) e.push(`Confirme os itens do checklist: ${pend.map((c) => c.label).join('; ')}.`);
  }
  return e;
}

function validateAll() {
  const all = [];
  for (let i = 0; i < 6; i++) all.push(...validateStep(i));
  const params = atividadeById(D.tipo)?.params ?? [];
  const fora = params.filter((p) => D.medicoes[p] != null && classify(p, Number(D.medicoes[p])) === 'risk');
  if (fora.length) all.push(`Medições fora do parâmetro: ${fora.map((p) => PARAMS[p].nome).join(', ')}.`);
  return all;
}

/* ============================================================
   MOUNT
   ============================================================ */
function mount(root) {
  /* Delegated listeners attach to `.wiz`, which is rebuilt by every full
     repaint — binding to `#view` instead would stack duplicate handlers. */
  const wiz = root.querySelector('.wiz');
  if (!wiz) return () => {};

  const repaint = () => {
    const view = document.querySelector('#view');
    view.innerHTML = render();
    mount(view);
    document.querySelector('#main').scrollTop = 0;
  };
  const repaintPane = () => {
    $('#wz-pane', root).innerHTML = pane();
    bindDirect();
  };

  /* ---- step navigation ---- */
  on(root, 'click', '[data-step]', (e, t) => {
    const target = Number(t.dataset.step);
    if (target > step) {
      for (let i = step; i < target; i++) {
        const errs = validateStep(i);
        if (errs.length) { toast('Etapa incompleta', errs[0], 'warn'); step = i; repaint(); return; }
      }
    }
    step = target; repaint();
  });

  $('#wz-prev', root)?.addEventListener('click', () => { if (step > 0) { step--; repaint(); } });
  $('#wz-next', root)?.addEventListener('click', () => {
    const errs = validateStep(step);
    if (errs.length) { toast('Etapa incompleta', errs[0], 'warn'); return; }
    step++; repaint();
  });

  $('#wz-done', root)?.addEventListener('click', () => {
    const problemas = validateAll();
    if (problemas.length) { toast('Não é possível liberar', problemas[0], 'risk', 6000); return; }
    const podeValidar = allow('pet.validate');
    confirm({
      title: podeValidar ? 'Liberar atividade' : 'Enviar para validação',
      confirmLabel: podeValidar ? 'Liberar atividade' : 'Enviar',
      message: podeValidar
        ? 'A permissão será emitida, validada e liberada em seu nome. O acesso da equipe será habilitado nas portarias e a ação ficará registrada na trilha de auditoria.'
        : 'A permissão será emitida e encaminhada à fila de validação de um gestor.',
      onConfirm: () => {
        const p = createPet({
          tipo: D.tipo, titulo: D.titulo.trim(), areaId: D.areaId, local: D.local.trim(),
          responsavelId: D.responsavelId, equipe: D.equipe,
          riscos: D.riscos, medidas: collectMedidas(),
          medicoes: Object.entries(D.medicoes).filter(([, v]) => v !== '' && v != null)
            .map(([param, valor]) => ({ param, valor: Number(valor) })),
          epis: D.epis, equipamentos: D.equipamentos, ferramentas: D.ferramentas,
          checklist: Object.fromEntries(CHECKLIST.map((c) => [c.id, true])),
          observacoes: D.observacoes,
          fimPrevisto: Date.now() + D.duracaoH * 3600000,
        });
        if (podeValidar) validatePet(p.id);
        D = null; step = 0; teamQuery = '';
        toast(
          podeValidar ? 'Permissão liberada' : 'Permissão enviada para validação',
          `${p.codigo} — ${podeValidar ? 'a equipe já pode acessar a área.' : 'aguardando aprovação de um gestor.'}`,
          'ok', 6000);
        location.hash = `#/pets/${p.id}`;
      },
    });
  });

  bindDelegated();
  bindDirect();

  /* Delegated handlers are attached once — the pane is re-rendered in place. */
  function bindDelegated() {
    /* 01 */
    on(wiz, 'click', '[data-tipo]', (e, t) => {
      D.tipo = t.dataset.tipo;
      const a = atividadeById(D.tipo);
      D.duracaoH = a.validadeH;
      D.riscos = [...a.riscos];
      D.epis = [...a.epis];
      repaintPane();
    });
    /* 02 */
    on(wiz, 'click', '[data-emp]', (e, t) => {
      const id = t.dataset.emp;
      const i = D.equipe.findIndex((m) => m.empId === id);
      if (i >= 0) D.equipe.splice(i, 1);
      else D.equipe.push({ empId: id, papel: D.equipe.length === 0 ? 'Executante líder' : 'Executante' });
      repaintPane();
    });
    on(wiz, 'click', '[data-rm]', (e, t) => {
      e.stopPropagation();
      D.equipe = D.equipe.filter((m) => m.empId !== t.dataset.rm);
      repaintPane();
    });
    on(wiz, 'change', '[data-papel]', (e, t) => {
      const m = D.equipe.find((x) => x.empId === t.dataset.papel);
      if (m) m.papel = t.value;
    });

    /* 03 */
    on(wiz, 'click', '[data-risco]', (e, t) => {
      const r = t.dataset.risco;
      D.riscos = D.riscos.includes(r) ? D.riscos.filter((x) => x !== r) : [...D.riscos, r];
      repaintPane();
    });

    /* 04 */
    on(wiz, 'input', '[data-med]', debounce((e, t) => {
      D.medicoes[t.dataset.med] = t.value;
      repaintPane();
      const f = root.querySelector(`[data-med="${t.dataset.med}"]`);
      f?.focus(); f?.setSelectionRange(f.value.length, f.value.length);
    }, 420));

    /* 05 */
    on(wiz, 'click', '[data-epi]', (e, t) => {
      const x = t.dataset.epi;
      D.epis = D.epis.includes(x) ? D.epis.filter((y) => y !== x) : [...D.epis, x];
      repaintPane();
    });
    on(wiz, 'click', '[data-epiname]', (e, t) => {
      const nome = t.dataset.epiname;
      const id = Object.keys(EPIS).find((k) => EPIS[k] === nome);
      if (!id) return;
      D.epis = D.epis.includes(id) ? D.epis.filter((y) => y !== id) : [...D.epis, id];
      repaintPane();
    });
    on(wiz, 'click', '[data-equip]', (e, t) => {
      const x = t.dataset.equip;
      D.equipamentos = D.equipamentos.includes(x) ? D.equipamentos.filter((y) => y !== x) : [...D.equipamentos, x];
      repaintPane();
    });
    on(wiz, 'click', '[data-ferr]', (e, t) => {
      const x = t.dataset.ferr;
      D.ferramentas = D.ferramentas.includes(x) ? D.ferramentas.filter((y) => y !== x) : [...D.ferramentas, x];
      repaintPane();
    });

    /* 06 */
    on(wiz, 'click', '[data-check]', (e, t) => {
      const id = t.dataset.check;
      const auto = autoChecks();
      const c = CHECKLIST.find((x) => x.id === id);
      const atual = D.checklist[id] ?? (c.auto ? auto[c.auto] === true : false);
      D.checklist[id] = !atual;
      repaintPane();
    });
  }

  /* Listeners bound to elements that are replaced on every pane repaint. */
  function bindDirect() {
    $('#f-titulo', root)?.addEventListener('input', (e) => { D.titulo = e.target.value; });
    $('#f-local', root)?.addEventListener('input', (e) => { D.local = e.target.value; });
    $('#f-obs', root)?.addEventListener('input', (e) => { D.observacoes = e.target.value; });
    $('#f-dur', root)?.addEventListener('input', (e) => { D.duracaoH = Math.max(1, Math.min(24, Number(e.target.value) || 8)); });
    $('#f-resp', root)?.addEventListener('change', (e) => { D.responsavelId = e.target.value; });
    $('#f-unidade', root)?.addEventListener('change', (e) => { D.unidade = e.target.value; D.areaId = ''; repaintPane(); });
    $('#f-area', root)?.addEventListener('change', (e) => { D.areaId = e.target.value; });

    $('#f-team-q', root)?.addEventListener('input', debounce((e) => {
      teamQuery = e.target.value;
      repaintPane();
      const f = $('#f-team-q', root);
      f?.focus(); f?.setSelectionRange(f.value.length, f.value.length);
    }, 240));

    $('#f-riscos-all', root)?.addEventListener('click', () => {
      D.riscos = [...new Set([...D.riscos, ...(atividadeById(D.tipo)?.riscos ?? [])])];
      repaintPane();
    });
    $('#f-medidas', root)?.addEventListener('input', (e) => { D.medidasExtra = e.target.value; });

    $('#f-med-sensor', root)?.addEventListener('click', () => {
      const params = atividadeById(D.tipo)?.params ?? [];
      params.forEach((pid) => {
        const s = state.sensors[`${D.areaId}:${pid}`];
        D.medicoes[pid] = s ? s.ultimo : PARAMS[pid].ideal;
      });
      repaintPane();
      toast('Leituras importadas', `${params.length} parâmetro(s) preenchido(s) a partir dos detectores da área.`, 'ok');
    });

    $('#f-epi-all', root)?.addEventListener('click', () => {
      D.epis = [...new Set([...D.epis, ...(atividadeById(D.tipo)?.epis ?? [])])];
      repaintPane();
    });
  }

  return () => {};
}

return { render, mount };
})();

const M_screens_pets = (() => {
/**
 * PET CONTROL — Permissões de Entrada de Trabalho: listagem e detalhe.
 */

const { esc, ago, hhmm, dtFull, dur, until, matches, on, $, $$, debounce, toCSV, downloadText } = M_util;
const { icon } = M_ui_icons;
const { avatar, avatarStack, panel, petBadge, empty, gaugeCard, medBadge, levelTag, empStatusBadge, searchBox, selectBox } = M_ui_kit;
const { toast, modal, confirm, close: closeOverlay } = M_ui_overlay;
const { emp, pet, allow, startPet, closePet, cancelPet, suspendPet, resumePet, registerMeasurement } = M_store;
const { petsInScope, petProgress, petHealth, petReadings, petChecklistDone, timelineOf } = M_selectors;
const { PET_STATUS, ATIVIDADES, atividadeById, atividadeNome, areaName, unitName, PARAMS, classify, RISCOS, riscoNome, epiNome, CHECKLIST, EVENTO, UNITS } = M_data_catalog;
const form = M_screens_pet_form;
/* ============================================================
   ROUTER ENTRY
   ============================================================ */
function render(params = []) {
  const [sub] = params;
  if (sub === 'nova') return form.render();
  if (sub) return detail(sub);
  return list();
}

function mount(root, params = []) {
  const [sub] = params;
  if (sub === 'nova') return form.mount(root);
  if (sub) return mountDetail(root, sub);
  return mountList(root);
}

/* ============================================================
   LIST
   ============================================================ */
const filtro = { q: '', status: 'TODOS', tipo: 'TODAS', area: 'TODAS' };

function filtered() {
  return petsInScope().filter((p) => {
    if (filtro.status !== 'TODOS' && p.status !== filtro.status) return false;
    if (filtro.tipo !== 'TODAS' && p.tipo !== filtro.tipo) return false;
    if (filtro.area !== 'TODAS' && p.areaId !== filtro.area) return false;
    return matches(filtro.q, p.codigo, p.titulo, areaName(p.areaId), atividadeNome(p.tipo), emp(p.responsavelId)?.nome ?? '');
  }).sort((a, b) => {
    const rank = { ATIVA: 0, EM_VALIDACAO: 1, LIBERADA: 2, SUSPENSA: 3, RASCUNHO: 4, ENCERRADA: 5, CANCELADA: 6 };
    return (rank[a.status] - rank[b.status]) || (b.criadaEm - a.criadaEm);
  });
}

function list() {
  const all = petsInScope();
  const rows = filtered();
  const c = (s) => all.filter((p) => p.status === s).length;

  return `<div class="page">
    <div class="page-hd">
      <div>
        <div class="crumbs">${icon('permit')} Operação ${icon('chevR')} Permissões</div>
        <h1>Permissões de Entrada de Trabalho</h1>
        <p class="lead">Emissão, acompanhamento e encerramento das PETs — substituindo o formulário físico por um registro digital rastreável.</p>
      </div>
      <div class="acts">
        <button class="btn btn-outline" id="pt-export">${icon('download')} Exportar CSV</button>
        ${allow('pet.create') ? `<a class="btn btn-primary" href="#/pets/nova">${icon('plus')} Nova PET</a>` : ''}
      </div>
    </div>

    <div class="grid g-kpi" style="margin-bottom:16px">
      ${[['ATIVA', 'Ativas', 'var(--ok)'], ['EM_VALIDACAO', 'Em validação', 'var(--warn)'], ['LIBERADA', 'Liberadas', 'var(--ac)'],
         ['SUSPENSA', 'Suspensas', 'var(--risk)'], ['ENCERRADA', 'Encerradas', 'var(--info)']]
        .map(([k, label, color]) => `<button class="kpi" style="--kpi-c:${color};text-align:left" data-fstatus="${k}">
          <div class="kpi-top"><span class="kpi-lbl">${label}</span>
          <span class="kpi-ico">${icon(PET_STATUS[k] ? 'permit' : 'permit')}</span></div>
          <div class="kpi-val">${String(c(k)).padStart(2, '0')}</div>
          <div class="kpi-ft"><span>clique para filtrar</span></div>
        </button>`).join('')}
    </div>

    <section class="panel">
      <div class="toolbar">
        ${searchBox('pt-q', 'Buscar por código, título, área ou responsável…', filtro.q)}
        ${selectBox('pt-status', [{ value: 'TODOS', label: 'Todos os status' },
          ...Object.entries(PET_STATUS).map(([k, v]) => ({ value: k, label: v.label }))], filtro.status)}
        ${selectBox('pt-tipo', [{ value: 'TODAS', label: 'Todas as atividades' },
          ...ATIVIDADES.map((a) => ({ value: a.id, label: a.nome }))], filtro.tipo)}
        ${selectBox('pt-area', [{ value: 'TODAS', label: 'Todas as áreas' },
          ...UNITS.flatMap((u) => u.areas.map((a) => ({ value: a.id, label: `${u.sigla} · ${a.nome}` })))], filtro.area)}
        <div class="grow"></div>
        <span class="mono" style="font-size:11px;color:var(--tx-dim)">${rows.length} de ${all.length}</span>
      </div>

      <div class="tbl-wrap">
        ${rows.length ? `<table class="tbl">
          <thead><tr>
            <th>Permissão</th><th>Atividade</th><th>Local</th><th>Equipe</th>
            <th>Responsável</th><th>Condição</th><th>Status</th><th class="right">Validade</th>
          </tr></thead>
          <tbody>${rows.slice(0, 120).map(rowHTML).join('')}</tbody>
        </table>` : empty('Nenhuma permissão encontrada', 'Ajuste os filtros ou emita uma nova PET.', 'permit')}
      </div>
    </section>
  </div>`;
}

function rowHTML(p) {

  const h = petHealth(p);
  const ativ = atividadeById(p.tipo);
  const resp = emp(p.responsavelId);
  const tone = h === 'risk' ? 'risk' : h === 'warn' ? 'warn' : 'ok';
  const vencida = p.fimPrevisto < Date.now() && ['ATIVA', 'LIBERADA'].includes(p.status);

  return `<tr class="clickable" data-pet="${esc(p.id)}">
    <td>
      <div class="mono cell-hi" style="font-size:12px;color:var(--ac)">${esc(p.codigo)}</div>
      <div class="truncate" style="max-width:250px;font-size:11.5px;color:var(--tx-lo);margin-top:2px">${esc(p.titulo)}</div>

    <td><div class="cell-hi">${esc(areaName(p.areaId))}</div><div style="font-size:11px;color:var(--tx-lo)">${esc(unitName(p.unidade))}</div></td>
    <td>${avatarStack(team, 3)}</td>
    <td class="nowrap">${esc(resp?.nome.split(' ').slice(0, 2).join(' ') ?? '—')}</td>
    <td><span class="badge b-${tone}"><i class="dot"></i>${tone === 'ok' ? 'normal' : tone === 'warn' ? 'atenção' : 'risco'}</span></td>
    <td>${petBadge(p.status, true)}</td>
    <td class="right nowrap">
      <span class="mono" style="font-size:11.5px;color:${vencida ? 'var(--risk)' : 'var(--tx-mid)'}">${esc(until(p.fimPrevisto))}</span>
    </td>
  </tr>`;
}

function mountList(root) {
  const page = root.querySelector('.page');
  if (!page) return null;
  const rerender = () => {
    const view = document.querySelector('#view');
    const scroll = document.querySelector('#main')?.scrollTop ?? 0;
    view.innerHTML = list();
    mountList(view);
    const m = document.querySelector('#main'); if (m) m.scrollTop = scroll;
  };

  const q = $('#pt-q', root);
  q?.addEventListener('input', debounce((e) => { filtro.q = e.target.value; rerender(); $('#pt-q')?.focus(); }, 240));
  $('#pt-status', root)?.addEventListener('change', (e) => { filtro.status = e.target.value; rerender(); });
  $('#pt-tipo', root)?.addEventListener('change', (e) => { filtro.tipo = e.target.value; rerender(); });

    downloadText(`pets-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, [
      { label: 'Código', get: (p) => p.codigo },

    ])).then((ok) => {
      if (ok) toast('Exportação concluída', `${rows.length} permissões exportadas em CSV.`, 'ok');
    });

  return null;
}

   DETAIL

        ${p.status === 'ATIVA' ? panel({

          body: `<div class="row-b" style="margin-bottom:10px">

              <span class="num" style="font-size:13px">${petProgress(p).toFixed(0)}%</span>
            </div>
            <div class="progress"><i style="width:${petProgress(p).toFixed(0)}%;background:${h === 'risk' ? 'var(--risk)' : h === 'warn' ? 'var(--warn)' : 'var(--ok)'}"></i></div>
            <div class="row-b" style="margin-top:12px">
              <span style="font-size:11.5px;color:var(--tx-lo)">Em execução há</span>
              <span class="mono" style="font-size:12px;color:var(--tx-hi)">${esc(dur(p.iniciadaEm))}</span>
            </div>
            <div class="row-b" style="margin-top:6px">
              <span style="font-size:11.5px;color:var(--tx-lo)">Vencimento</span>
              <span class="mono" style="font-size:12px;color:${p.fimPrevisto < Date.now() ? 'var(--risk)' : 'var(--tx-hi)'}">${esc(until(p.fimPrevisto))}</span>
            </div>`,
        }) : ''}

        ${panel({
          title: 'Condição atual',
          body: readings.length ? `<div class="col g-3">${readings.map((r) =>

}

function banner(tone, title, text) {
  const c = { risk: 'var(--risk)', warn: 'var(--warn)', idle: 'var(--idle)', ok: 'var(--ok)' }[tone];
  return `<div class="panel" style="border-color:${c}44;background:linear-gradient(90deg, ${c}12, transparent 60%);margin-bottom:16px">
    <div class="panel-bd" style="padding:13px 18px">
      <div class="row g-3">
        <span style="color:${c};display:flex;flex:none">${icon(tone === 'ok' ? 'okCircle' : 'warnCircle', 17)}</span>
        <div>
          <div style="font-size:12.5px;font-weight:600;color:var(--tx-hi)">${esc(title)}</div>
          <div style="font-size:11.5px;color:var(--tx-lo);margin-top:2px">${esc(text)}</div>

function actionsFor(p) {
  const a = [];
  if (p.status === 'EM_VALIDACAO') a.push(`<a class="btn btn-primary" href="#/validacao/${esc(p.id)}">${icon('checks')} Abrir validação</a>`);
  if (p.status === 'LIBERADA' && allow('pet.edit')) a.push(`<button class="btn btn-ok" data-act="start">${icon('play')} Iniciar atividade</button>`);
  if (p.status === 'ATIVA') {
    if (allow('med.register')) a.push(`<button class="btn btn-outline" data-act="med">${icon('gauge')} Registrar medição</button>`);
    if (allow('pet.edit')) a.push(`<button class="btn btn-warn" data-act="suspend">${icon('pause')} Suspender</button>`);
    if (allow('pet.close')) a.push(`<button class="btn btn-primary" data-act="close">${icon('stop')} Encerrar</button>`);
  }
  if (p.status === 'SUSPENSA' && allow('pet.edit')) a.push(`<button class="btn btn-ok" data-act="resume">${icon('play')} Retomar</button>`);
  if (['EM_VALIDACAO', 'LIBERADA', 'RASCUNHO'].includes(p.status) && allow('pet.cancel')) a.push(`<button class="btn btn-risk" data-act="cancel">${icon('xCircle')} Cancelar</button>`);
  a.push(`<button class="btn btn-outline" data-act="print">${icon('print')} Ficha</button>`);
  return a.join('');
}

/* ---------- detail behaviour ---------- */
function mountDetail(root, id) {
  const p = pet(id);
  if (!p) return null;
  const page = root.querySelector('.page');
  if (!page) return null;

  const refresh = () => {
    const view = document.querySelector('#view');
    const scroll = document.querySelector('#main')?.scrollTop ?? 0;
    view.innerHTML = detail(id);
    mountDetail(view, id);
    const m = document.querySelector('#main'); if (m) m.scrollTop = scroll;
  };

  on(page, 'click', '[data-tab]', (e, t) => {
    tab = t.dataset.tab;
    $$('#pd-tabs button', root).forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    $('#pd-pane', root).innerHTML = paneFor(pet(id), tab);
  });

  on(page, 'click', '[data-act]', (e, t) => {
    const act = t.dataset.act;
    const cur = pet(id);
    if (act === 'start') {
      startPet(id);
      toast('Atividade iniciada', `${cur.codigo} — execução liberada em campo e registrada na trilha.`, 'ok');
      refresh();
    }
    if (act === 'suspend') {
      confirm({
        title: 'Suspender atividade', tone: 'warn', confirmLabel: 'Suspender', requireReason: true,
        message: `A execução de ${cur.codigo} será interrompida e a equipe deverá deixar a área. Informe o motivo.`,
        onConfirm: (motivo) => { suspendPet(id, motivo); toast('Atividade suspensa', 'A equipe deve ser evacuada da área.', 'warn'); refresh(); },
      });
    }
    if (act === 'resume') {
      confirm({
        title: 'Retomar atividade', confirmLabel: 'Retomar',
        message: 'Confirme que as condições foram normalizadas e as medições estão dentro dos parâmetros.',
        onConfirm: () => { resumePet(id); toast('Atividade retomada', 'Execução liberada novamente.', 'ok'); refresh(); },
      });
    }
    if (act === 'close') {
      confirm({
        title: 'Encerrar permissão', confirmLabel: 'Encerrar PET',
        message: `${cur.codigo} será encerrada, a área desmobilizada e o histórico arquivado digitalmente.`,
        onConfirm: () => { closePet(id); toast('PET encerrada', 'Documentação arquivada e disponível em Rastreabilidade.', 'ok'); refresh(); },
      });
    }
    if (act === 'cancel') {
      confirm({
        title: 'Cancelar permissão', tone: 'risk', confirmLabel: 'Cancelar PET', requireReason: true,
        message: `${cur.codigo} será cancelada. O motivo fica registrado na auditoria.`,
        onConfirm: (motivo) => { cancelPet(id, motivo); toast('PET cancelada', 'Registro mantido para auditoria.', 'warn'); refresh(); },
      });
    }
    if (act === 'med') openMeasureModal(cur, refresh);
    if (act === 'print') openFicha(cur);
  });

  return null;
}

/* ---------- measurement modal ---------- */
function openMeasureModal(p, done) {
  const ativ = atividadeById(p.tipo);
  const params = ativ?.params ?? Object.keys(PARAMS).slice(0, 4);
  modal({
    title: 'Registrar medição',
    sub: `${p.codigo} · ${areaName(p.areaId)}`,
    width: 560,
    body: `<div class="col g-4">
      <div class="field">
        <label for="md-p">Parâmetro</label>
        <select id="md-p" class="sel">${params.map((x) =>
          `<option value="${x}">${esc(PARAMS[x].nome)} (${esc(PARAMS[x].unidade)})</option>`).join('')}</select>
      </div>
      <div class="field">
        <label for="md-v">Valor lido</label>
        <input id="md-v" class="inp" type="number" step="0.1" placeholder="0,0">
        <span class="hint" id="md-hint"></span>
      </div>
      <div id="md-prev"></div>
    </div>`,
    footer: `<button class="btn" data-close>Cancelar</button>
      <button class="btn btn-primary" id="md-ok">${icon('check')} Registrar</button>`,
    onMount(root) {
      const sel = root.querySelector('#md-p');
      const inp = root.querySelector('#md-v');
      const hint = root.querySelector('#md-hint');
      const prev = root.querySelector('#md-prev');
      const sync = () => {
        const P = PARAMS[sel.value];
        hint.textContent = `Faixa aceitável: ${P.min} a ${P.max} ${P.unidade}`;
        if (!inp.value) { inp.value = P.ideal; }
        prev.innerHTML = gaugeCard(sel.value, Number(inp.value), {});
      };
      sel.addEventListener('change', () => { inp.value = PARAMS[sel.value].ideal; sync(); });
      inp.addEventListener('input', sync);
      sync();

      root.querySelector('#md-ok').addEventListener('click', () => {
        const v = Number(inp.value);
        if (Number.isNaN(v)) { inp.focus(); return; }
        const m = registerMeasurement(p.id, sel.value, v);
        closeOverlay();
        const st = classify(sel.value, v);
        toast(
          st === 'risk' ? 'Medição fora do parâmetro' : 'Medição registrada',
          st === 'risk' ? 'Alerta gerado automaticamente na central.' : `${PARAMS[sel.value].nome}: ${v} ${PARAMS[sel.value].unidade}.`,
          st === 'risk' ? 'risk' : 'ok');
        done?.();
      });
    },
  });
}

/* ---------- printable summary ---------- */
function openFicha(p) {
  const team = p.equipe.map((m) => emp(m.empId)).filter(Boolean);
  modal({
    title: `Ficha da permissão ${p.codigo}`,
    sub: 'Documento digital equivalente à via física',
    width: 720,
    body: `<div class="col g-4">
      ${['Identificação', 'Equipe', 'Riscos e medidas', 'Medições', 'Recursos', 'Validação'].map((sec, i) => {
        let inner = '';
        if (i === 0) inner = `<dl class="kv">
          <dt>Atividade</dt><dd>${esc(atividadeNome(p.tipo))}</dd>
          <dt>Local</dt><dd>${esc(p.local)} — ${esc(areaName(p.areaId))}, ${esc(unitName(p.unidade))}</dd>
          <dt>Responsável</dt><dd>${esc(emp(p.responsavelId)?.nome ?? '—')}</dd>
          <dt>Validade</dt><dd class="mono">${esc(dtFull(p.inicioPrevisto))} → ${esc(dtFull(p.fimPrevisto))}</dd></dl>`;
        if (i === 1) inner = team.map((e) => `<div class="row-b" style="padding:5px 0;border-bottom:1px solid var(--line-soft)">
          <span style="font-size:12.5px;color:var(--tx-hi)">${esc(e.nome)}</span>
          <span style="font-size:11.5px;color:var(--tx-lo)">${esc(e.funcao)} · ${esc(e.matricula)}</span></div>`).join('');
        if (i === 2) inner = `<div style="font-size:12.5px;line-height:1.7;color:var(--tx)">
          <strong style="color:var(--tx-hi)">Riscos:</strong> ${p.riscos.map(riscoNome).map(esc).join('; ')}<br>
          <strong style="color:var(--tx-hi)">Medidas:</strong> ${p.medidas.map(esc).join('; ')}</div>`;
        if (i === 3) inner = petReadings(p).map((r) => `<div class="row-b" style="padding:5px 0;border-bottom:1px solid var(--line-soft)">
          <span style="font-size:12.5px">${esc(PARAMS[r.param].nome)}</span>
          <span class="mono">${r.valor} ${esc(PARAMS[r.param].unidade)} ${medBadge(classify(r.param, r.valor))}</span></div>`).join('');
        if (i === 4) inner = `<div class="row g-2 wrap">${[...p.epis.map(epiNome), ...p.equipamentos].map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>`;
        if (i === 5) inner = `<dl class="kv">
          <dt>Validada por</dt><dd>${esc(emp(p.validadaPorId)?.nome ?? '—')}</dd>
          <dt>Data/hora</dt><dd class="mono">${p.validadaEm ? esc(dtFull(p.validadaEm)) : '—'}</dd>
          <dt>Checklist</dt><dd>${petChecklistDone(p)}/${CHECKLIST.length} itens conferidos</dd>
          <dt>Status atual</dt><dd>${petBadge(p.status)}</dd></dl>`;
        return `<div class="review-sec"><div class="rs-hd"><span class="t">0${i + 1} — ${esc(sec)}</span></div>
          <div class="rs-bd">${inner || '<span class="t-lo">—</span>'}</div></div>`;
      }).join('')}
    </div>`,
    footer: `<button class="btn" data-close>Fechar</button>
      <button class="btn btn-primary" onclick="window.print()">${icon('print')} Imprimir</button>`,
  });
}

return { render, mount };
})();

/* ---------- src/screens/validacao.js ---------- */
const M_screens_validacao = (() => {
/**

 */

const { esc, dur, hhmm, on } = M_util;

const { avatar, panel, petBadge, empty, gaugeCard } = M_ui_kit;

const { CHECKLIST, classify, atividadeById, areaName, unitName, riscoNome, epiNome } = M_data_catalog;
function render(params = []) {

  return `<div class="page">

        <h1>Validação da PET</h1>

/* ------------------------------------------------------------ */
function mount(root, params = []) {
  const page = root.querySelector('.page');
  if (!page) return null;
  let currentId = params[0] ?? petsValidacao()[0]?.id ?? null;

  const repaint = () => {
    const view = document.querySelector('#view');
    const scroll = document.querySelector('#main')?.scrollTop ?? 0;
    view.innerHTML = render(currentId ? [currentId] : []);
    mount(view, currentId ? [currentId] : []);
    const m = document.querySelector('#main'); if (m) m.scrollTop = scroll;
  };

  on(page, 'click', '[data-pick]', (e, t) => { currentId = t.dataset.pick; repaint(); });

  on(page, 'click', '[data-chk]', (e, t) => {
    if (!allow('pet.validate')) { toast('Sem permissão', 'A conferência do checklist exige nível Gestor.', 'warn'); return; }
    const p = pet(currentId); if (!p) return;
    const id = t.dataset.chk;
    setChecklist(p.id, id, !p.checklist?.[id]?.ok);
    repaint();
  });

  on(page, 'click', '[data-vact]', (e, t) => {
    const p = pet(currentId); if (!p) return;
    if (t.dataset.vact === 'approve') {
      confirm({
        title: 'Aprovar permissão',
        confirmLabel: 'Aprovar e liberar',
        message: `${p.codigo} será validada e liberada para execução. O acesso da equipe será habilitado e o registro (usuário, data, horário e ação) ficará permanente na trilha de auditoria.`,
        onConfirm: () => {
          validatePet(p.id);
          toast('PET liberada', `${p.codigo} validada por ${me()?.nome.split(' ')[0]} — equipe autorizada nas portarias.`, 'ok', 6000);
          currentId = petsValidacao()[0]?.id ?? null;
          repaint();
        },
      });
    }
    if (t.dataset.vact === 'cancel') {
      confirm({
        title: 'Recusar permissão', tone: 'risk', confirmLabel: 'Recusar PET', requireReason: true,
        message: `${p.codigo} será cancelada e devolvida ao emissor. Informe o motivo da recusa.`,
        onConfirm: (motivo) => {
          cancelPet(p.id, `Recusada na validação — ${motivo}`);
          toast('Permissão recusada', 'O emissor foi notificado e o motivo registrado.', 'warn');
          currentId = petsValidacao()[0]?.id ?? null;
          repaint();
        },
      });
    }
  });

  return null;
}

return { render, mount };
})();

/* ------------------------------------------------------------ */
function mount(root) {
  const page = root.querySelector('.page');
  if (!page) return null;

  const repaint = () => {
    const view = document.querySelector('#view');
    const scroll = document.querySelector('#main')?.scrollTop ?? 0;
    view.innerHTML = render();
    mount(view);
    const m = document.querySelector('#main'); if (m) m.scrollTop = scroll;
  };

  $('#ac-emp', root)?.addEventListener('change', (e) => { sim.empId = e.target.value; sim.rec = null; sim.estado = 'idle'; repaint(); });
  $('#ac-area', root)?.addEventListener('change', (e) => { sim.areaId = e.target.value; sim.rec = null; sim.estado = 'idle'; repaint(); });

  const run = async (direcao) => {
    if (!sim.empId || !sim.areaId) { toast('Seleção incompleta', 'Escolha o colaborador e o ponto de acesso.', 'warn'); return; }
    sim.estado = 'scan'; sim.rec = null; repaint();
    await sleep(1250);
    const rec = registerAccess(sim.empId, sim.areaId, direcao);
    sim.rec = rec;
    sim.estado = rec.resultado === 'LIBERADO' ? 'ok' : 'bad';
    repaint();
    if (rec.resultado === 'LIBERADO') {
      toast('Acesso liberado', `${emp(rec.empId)?.nome} — ${rec.motivo}.`, 'ok');
    } else {
      toast('Acesso bloqueado', `${emp(rec.empId)?.nome ?? 'Colaborador'} — ${rec.motivo}. Alerta gerado.`, 'risk', 6000);
    }
  };

  $('#ac-run', root)?.addEventListener('click', () => run('ENTRADA'));
  $('#ac-exit', root)?.addEventListener('click', () => run('SAIDA'));

  /* One-click demo shortcuts: pick a scenario that is guaranteed to work. */
  $('#ac-lucky-ok', root)?.addEventListener('click', () => {
    /* Pick a pair the authorization rules actually approve, so the demo of the
       happy path never depends on which crew member happens to come first. */
    let alvo = null;
    for (const p of petsInScope().filter((x) => ['ATIVA', 'LIBERADA'].includes(x.status))) {
      const m = p.equipe.find((x) => evaluateAccess(x.empId, p.areaId).ok);
      if (m) { alvo = { empId: m.empId, areaId: p.areaId }; break; }
    }
    if (!alvo) { toast('Nenhum caso autorizado', 'Libere uma PET com equipe habilitada para a área.', 'warn'); return; }
    Object.assign(sim, { ...alvo, rec: null, estado: 'idle' });
    repaint(); run('ENTRADA');
  });
  $('#ac-lucky-bad', root)?.addEventListener('click', () => {
    const alvo = state.employees.find((e) => e.status !== 'ATIVO' || !e.face)
      ?? state.employees.find((e) => (e.treinamentos ?? []).some((t) => t.validade < Date.now()))
      ?? state.employees[state.employees.length - 1];
    const area = ALL_AREAS.find((a) => !alvo.areas.includes(a.id)) ?? ALL_AREAS[0];
    Object.assign(sim, { empId: alvo.id, areaId: area.id, rec: null, estado: 'idle' });
    repaint(); run('ENTRADA');
  });

  $('#ac-q', root)?.addEventListener('input', debounce((e) => {
    f.q = e.target.value; repaint();
    const el = $('#ac-q'); el?.focus(); el?.setSelectionRange(el.value.length, el.value.length);
  }, 250));
  $('#ac-res', root)?.addEventListener('change', (e) => { f.resultado = e.target.value; repaint(); });
  $('#ac-farea', root)?.addEventListener('change', (e) => { f.area = e.target.value; repaint(); });

  $('#ac-export', root)?.addEventListener('click', () => {
    const rows = filtered();
    downloadText(`acessos-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, [
      { label: 'Data/hora', get: (a) => dtFull(a.ts) },
      { label: 'Colaborador', get: (a) => emp(a.empId)?.nome ?? '' },
      { label: 'Matrícula', get: (a) => emp(a.empId)?.matricula ?? '' },
      { label: 'Área', get: (a) => areaName(a.areaId) },
      { label: 'Unidade', get: (a) => unitName(a.unidade) },
      { label: 'PET', get: (a) => pet(a.petId)?.codigo ?? '' },
      { label: 'Sentido', get: (a) => a.direcao },
      { label: 'Resultado', get: (a) => a.resultado },
      { label: 'Confiança (%)', get: (a) => a.confianca },
      { label: 'Motivo', get: (a) => a.motivo },
    ])).then((ok) => {
      if (ok) toast('Exportação concluída', `${rows.length} registros de acesso exportados.`, 'ok');
    });
  });

  return null;
}

return { render, mount };
})();

   ============================================================ */
function openFaceCapture(onDone) {
  let stop = () => {};
  modal({
    title: 'Registro facial',
    sub: 'Captura do template biométrico do colaborador',
    width: 480,
    body: `<div class="col g-4">
      <div class="capture" id="cap-box">
        <div class="fx-scan"></div><div class="fx-vig"></div>
        <div class="cap-frame"></div>
        ${meshSVG()}
        <div class="cap-ft" id="cap-ft">Posicione o rosto dentro da moldura</div>
      </div>
      <div class="panel panel-inset" style="padding:12px 14px">
        <div class="row-b"><span class="eyebrow">Qualidade do template</span>
          <span class="num" id="cap-q" style="font-size:15px">—</span></div>
        <div class="progress" style="margin-top:9px"><i id="cap-bar" style="width:0%"></i></div>
        <div style="font-size:11px;color:var(--tx-dim);margin-top:9px;line-height:1.55">
          MVP demonstrativo: nenhuma imagem é armazenada. O template é simulado
          para demonstrar o fluxo de cadastro biométrico.
        </div>
      </div>
    </div>`,
    footer: `<button class="btn" data-close>Cancelar</button>
      <button class="btn btn-primary" id="cap-go">${icon('camera')} Capturar</button>`,
    onMount(root) {
      const box = root.querySelector('#cap-box');
      attachFeed(box).then((s) => { stop = s; });
      root.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) { stop(); releaseStream(); } });

      root.querySelector('#cap-go').addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        btn.classList.add('btn-loading');
        root.querySelector('#cap-ft').textContent = 'Capturando pontos de referência…';
        let q = 0;
        const target = 88 + Math.round(Math.random() * 11);
        await new Promise((res) => {
          const t = setInterval(() => {
            q = Math.min(target, q + Math.random() * 9);
            root.querySelector('#cap-q').textContent = `${q.toFixed(0)}%`;
            root.querySelector('#cap-bar').style.width = `${q}%`;
            root.querySelector('#cap-bar').style.background = q > 85 ? 'var(--ok)' : q > 60 ? 'var(--warn)' : 'var(--risk)';
            if (q >= target) { clearInterval(t); res(); }
          }, 90);
        });
        box.classList.add('done');
        root.querySelector('#cap-ft').textContent = 'Template biométrico registrado com sucesso';
        btn.classList.remove('btn-loading');
        await sleep(650);
        stop(); releaseStream();
        closeOverlay();
        onDone(Math.round(target));
      });
    },
  });
}

              <span class="feed-ico" id="nf-face-ico" style="color:var(--tx-dim)">${icon('scanface')}</span>
              <div>
                <div style="font-size:12.5px;color:var(--tx-hi)" id="nf-face-t">Nenhum registro facial</div>
                <div style="font-size:11.5px;color:var(--tx-lo);margin-top:2px" id="nf-face-s">
                  Sem biometria, o colaborador não será liberado nas portarias.
                </div>
              </div>
            </div>
            <button class="btn btn-outline" id="nf-face" type="button">${icon('camera')} Capturar rosto</button>
          </div>
        </div>
      </div>
    </div>`,
    footer: `<button class="btn" data-close>Cancelar</button>
      <button class="btn btn-primary" id="nf-save">${icon('check')} Cadastrar colaborador</button>`,
    onMount(root) {
      const nivel = root.querySelector('#nf-nivel');
      nivel.addEventListener('change', () => {
        draft.nivel = nivel.value;
        root.querySelector('#nf-nivel-hint').textContent = NIVEIS[draft.nivel].desc;
      });
      root.querySelector('#nf-unidade').addEventListener('change', (e) => {
        draft.unidade = e.target.value; draft.areas = [];
        root.querySelector('#nf-areas').innerHTML = areasHTML();
      });
      on(root, 'click', '[data-area]', (e, t) => {
        const a = t.dataset.area;
        draft.areas = draft.areas.includes(a) ? draft.areas.filter((x) => x !== a) : [...draft.areas, a];
        root.querySelector('#nf-areas').innerHTML = areasHTML();
      });

      root.querySelector('#nf-face').addEventListener('click', () => {
        const nome = root.querySelector('#nf-nome').value.trim();
        Object.assign(draft, {
          nome, funcao: root.querySelector('#nf-funcao').value.trim(),
          matricula: root.querySelector('#nf-mat').value.trim(),
          telefone: root.querySelector('#nf-tel').value.trim(),
          restricoes: root.querySelector('#nf-restr').value.trim(),
        });
        closeOverlay();
        openFaceCapture((q) => {
          draft.face = true; draft.faceQualidade = q;
          openNew(refresh, draft);
        });
      });

      root.querySelector('#nf-save').addEventListener('click', () => {
        const nome = root.querySelector('#nf-nome');
        const funcao = root.querySelector('#nf-funcao');
        let bad = false;
        [[nome, nome.value.trim().length > 4], [funcao, funcao.value.trim().length > 2]].forEach(([inp, ok]) => {
          inp.closest('.field').classList.toggle('invalid', !ok);
          if (!ok) bad = true;
        });
        const areaField = root.querySelector('#nf-areas').closest('.field');
        areaField.classList.toggle('invalid', draft.areas.length === 0);
        if (draft.areas.length === 0) bad = true;
        if (bad) { toast('Cadastro incompleto', 'Revise os campos destacados.', 'warn'); return; }

        const e = createEmployee({
          nome: nome.value.trim(),
          funcao: funcao.value.trim(),
          matricula: root.querySelector('#nf-mat').value.trim(),
          telefone: root.querySelector('#nf-tel').value.trim(),
          nivel: draft.nivel, unidade: draft.unidade, areas: draft.areas,
          restricoes: root.querySelector('#nf-restr').value.trim() ? [root.querySelector('#nf-restr').value.trim()] : [],
          face: draft.face, faceQualidade: draft.faceQualidade,
          treinamentos: [{ nome: 'NR-06 EPI', validade: Date.now() + 365 * 86400000 }],
        });
        closeOverlay();
        toast('Funcionário cadastrado',
          draft.face ? `${e.nome} já pode ser vinculado a uma PET.` : `${e.nome} cadastrado — registre a biometria para liberar o acesso físico.`,
          draft.face ? 'ok' : 'warn', 5200);
        refresh?.();
      });

      /* Reflect a template captured before returning to this form. */
      if (draft.face) {
        root.querySelector('#nf-face-ico').style.color = 'var(--ok)';
        root.querySelector('#nf-face-ico').innerHTML = icon('userCheck');
        root.querySelector('#nf-face-t').textContent = 'Biometria capturada';
        root.querySelector('#nf-face-s').textContent = `Template com ${draft.faceQualidade}% de qualidade — pronto para uso nas portarias.`;
        root.querySelector('#nf-face').innerHTML = `${icon('refresh')} Recapturar`;
      }
    },
  });
}

/* ============================================================ */
function mount(root) {
  const page = root.querySelector('.page');
  if (!page) return null;

  const repaint = () => {
    const view = document.querySelector('#view');
    const scroll = document.querySelector('#main')?.scrollTop ?? 0;
    view.innerHTML = render();
    mount(view);
    const m = document.querySelector('#main'); if (m) m.scrollTop = scroll;
  };

  $('#fn-q', root)?.addEventListener('input', debounce((e) => {
    f.q = e.target.value; repaint();
    const el = $('#fn-q'); el?.focus(); el?.setSelectionRange(el.value.length, el.value.length);
  }, 240));
  $('#fn-nivel', root)?.addEventListener('change', (e) => { f.nivel = e.target.value; repaint(); });
  $('#fn-status', root)?.addEventListener('change', (e) => { f.status = e.target.value; repaint(); });
  $('#fn-unidade', root)?.addEventListener('change', (e) => { f.unidade = e.target.value; repaint(); });

  $('#fn-new', root)?.addEventListener('click', () => openNew(repaint));
  on(page, 'click', '[data-emp]', (e, t) => openDetail(t.dataset.emp, repaint));

  $('#fn-export', root)?.addEventListener('click', () => {
    const rows = filtered();
    downloadText(`funcionarios-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, [
      { label: 'Nome', get: (e) => e.nome },
      { label: 'Matrícula', get: (e) => e.matricula },
      { label: 'Função', get: (e) => e.funcao },
      { label: 'Nível', get: (e) => NIVEIS[e.nivel].label },
      { label: 'Unidade', get: (e) => unitName(e.unidade) },
      { label: 'Áreas', get: (e) => e.areas.map(areaName).join(' | ') },
      { label: 'Biometria', get: (e) => (e.face ? `${e.faceQualidade}%` : 'não registrada') },
      { label: 'Situação', get: (e) => e.status },
      { label: 'Cadastro', get: (e) => dtFull(e.cadastradoEm) },
      { label: 'Último acesso', get: (e) => (e.ultimoAcesso ? dtFull(e.ultimoAcesso) : '') },
    ])).then((ok) => {
      if (ok) toast('Exportação concluída', `${rows.length} colaboradores exportados.`, 'ok');
    });
  });

  return null;
}

return { render, openFaceCapture, mount };
})();

/* ---------- src/screens/medicoes.js ---------- */
const M_screens_medicoes = (() => {
/**
 * PET CONTROL — Monitoramento de medições.
 * Continuous readings from the area detectors, with the acceptable band always
 * visible so "out of parameter" is obvious at a glance.
 */

const { esc, hhmm, dtFull, on, $, toCSV, downloadText } = M_util;
const { icon } = M_ui_icons;
const { panel, kpi, empty, gaugeCard, medBadge, selectBox } = M_ui_kit;
const { areaChart, radial, TONE, legend } = M_ui_charts;
const { toast } = M_ui_overlay;
const { state, emp, pet } = M_store;
const { sensorsInScope, sensorSummary, petsInScope } = M_selectors;
const { PARAMS, classify, STATUS_MEDICAO, areaName, ALL_AREAS } = M_data_catalog;
const f = { area: 'TODAS', param: 'TODOS', foco: null };

function render() {
  const sensores = sensorsInScope().filter((s) =>
    (f.area === 'TODAS' || s.areaId === f.area) && (f.param === 'TODOS' || s.param === f.param));
  const sum = sensorSummary();
  const foco = f.foco ? state.sensors[f.foco] : sensores[0];

  return `<div class="page">
    <div class="page-hd">
      <div>
        <div class="crumbs">${icon('gauge')} Monitoramento ${icon('chevR')} Medições</div>
        <h1>Monitoramento de medições</h1>
        <p class="lead">Leituras contínuas dos detectores instalados nas áreas, correlacionadas às permissões vigentes. Valores fora da faixa geram alerta automático.</p>
      </div>
      <div class="acts">
        <span class="badge ${sum.risk ? 'b-risk' : sum.warn ? 'b-warn' : 'b-ok'} badge-live"><i class="dot"></i>
          ${sum.risk ? `${sum.risk} fora do parâmetro` : sum.warn ? `${sum.warn} em atenção` : 'todas normais'}</span>
        <button class="btn btn-outline" id="md-export">${icon('download')} Exportar leituras</button>
      </div>
    </div>

    <div class="grid g-kpi" style="margin-bottom:16px">
      ${kpi({ label: 'Pontos monitorados', value: sum.total, ico: 'radio', color: 'var(--ac)', foot: '<span>detectores ativos</span>' })}
      ${kpi({ label: 'Dentro do parâmetro', value: sum.ok ?? 0, ico: 'okCircle', color: 'var(--ok)', foot: `<span>${(((sum.ok ?? 0) / (sum.total || 1)) * 100).toFixed(0)}% da malha</span>` })}
      ${kpi({ label: 'Em atenção', value: String(sum.warn ?? 0).padStart(2, '0'), ico: 'warnCircle', color: 'var(--warn)', foot: '<span>próximo do limite</span>' })}
      ${kpi({ label: 'Fora do parâmetro', value: String(sum.risk ?? 0).padStart(2, '0'), ico: 'alert', color: sum.risk ? 'var(--risk)' : 'var(--idle)', foot: `<span class="${sum.risk ? 't-risk' : ''}">ação imediata requerida</span>` })}
    </div>

    <section class="panel" style="margin-bottom:16px">
      <div class="toolbar">
        ${selectBox('md-area', [{ value: 'TODAS', label: 'Todas as áreas' }, ...ALL_AREAS.map((a) => ({ value: a.id, label: `${a.unidade} · ${a.nome}` }))], f.area)}
        ${selectBox('md-param', [{ value: 'TODOS', label: 'Todos os parâmetros' }, ...Object.values(PARAMS).map((p) => ({ value: p.id, label: p.nome }))], f.param)}
        <div class="grow"></div>
        <span class="mono" style="font-size:11px;color:var(--tx-dim)">${sensores.length} pontos · leitura a cada 5s</span>
      </div>
      <div class="panel-bd">
        ${sensores.length ? `<div class="grid g-auto">${sensores.map((s) => `
          <button data-focus="${esc(s.key)}" style="text-align:left;width:100%">
            ${gaugeCard(s.param, s.ultimo, { ts: s.serie[s.serie.length - 1]?.ts, live: true })}
            <div style="font-size:10.5px;color:var(--tx-dim);margin-top:6px;padding-left:2px">${icon('pin', 10)} ${esc(areaName(s.areaId))}</div>
          </button>`).join('')}</div>`
          : empty('Nenhum ponto monitorado', 'Ajuste os filtros de área ou parâmetro.', 'radio')}
      </div>
    </section>

    ${foco ? focoHTML(foco) : ''}

    ${historicoHTML()}
  </div>`;
}

/* ------------------------------------------------------------ */
function focoHTML(s) {
  const P = PARAMS[s.param];
  const st = classify(s.param, s.ultimo);
  const tone = st === 'risk' ? TONE.risk : st === 'warn' ? TONE.warn : TONE.ok;
  const data = s.serie.slice(-48);
  const petAtiva = petsInScope().find((p) => p.areaId === s.areaId && p.status === 'ATIVA');
  const vals = data.map((d) => d.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const avg = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);

  return panel({
    title: `${P.nome} · ${areaName(s.areaId)}`,
    sub: `Série das últimas ${data.length} leituras · faixa aceitável ${P.min}–${P.max} ${P.unidade}`,
    actions: legend([
      { color: tone, label: 'Leitura' },
      { color: 'rgba(45,212,167,.35)', label: 'Faixa aceitável' },
    ]),
    cls: 'panel-rail',
    body: `<div class="grid g-focus" style="gap:20px">
      <div>
        ${areaChart({
          h: 210,
          series: [{ name: P.nome, data: vals, color: tone }],
          labels: data.map((d) => hhmm(d.ts)),
          yMin: Math.min(P.scaleMin, min - 1),
          yMax: Math.max(P.max + (P.max - P.min) * 0.15, max + 1),
          bands: [{ min: P.min, max: P.max, color: '#2DD4A7', opacity: .07, line: P.max }],
          yFmt: (v) => v.toFixed(P.dec),
        })}
      </div>
      <div class="col g-4" style="align-items:center">
        ${radial({ value: s.ultimo, min: P.scaleMin, max: P.scaleMax, safeMin: P.min, safeMax: P.max, tone, unit: P.unidade, label: P.nome })}
        <div style="width:100%">
          <div class="row-b" style="font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line-soft)">
            <span class="t-lo">Mínima</span><span class="num">${min.toFixed(P.dec)}</span></div>
          <div class="row-b" style="font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line-soft)">
            <span class="t-lo">Média</span><span class="num">${avg.toFixed(P.dec)}</span></div>
          <div class="row-b" style="font-size:11.5px;padding:5px 0">
            <span class="t-lo">Máxima</span><span class="num">${max.toFixed(P.dec)}</span></div>
        </div>
        ${petAtiva ? `<a class="btn btn-sm btn-outline btn-block" href="#/pets/${esc(petAtiva.id)}">${icon('permit')} ${esc(petAtiva.codigo)}</a>` : ''}
      </div>
    </div>`,
  });
}

/* ------------------------------------------------------------ */
function historicoHTML() {
  const registros = state.pets.flatMap((p) => p.medicoes.map((m) => ({ ...m, p })))
    .sort((a, b) => b.ts - a.ts).slice(0, 40);

  return `<section class="panel" style="margin-top:16px">
    <header class="panel-hd"><div><h3>Histórico de medições registradas</h3>
      <div class="sub">Leituras vinculadas a permissões, com responsável identificado</div></div></header>
    <div class="tbl-wrap">
      ${registros.length ? `<table class="tbl">
        <thead><tr><th>Parâmetro</th><th>Valor</th><th>Faixa</th><th>Situação</th><th>PET</th><th>Área</th><th>Responsável</th><th class="right">Registro</th></tr></thead>
        <tbody>${registros.map((m) => {
          const P = PARAMS[m.param];
          const st = classify(m.param, m.valor);
          return `<tr class="clickable" data-pet="${esc(m.p.id)}">
            <td class="cell-hi"><span class="row g-2">${icon(P.icon, 13)} ${esc(P.nome)}</span></td>
            <td class="num">${m.valor}<span style="color:var(--tx-dim);font-size:10.5px"> ${esc(P.unidade)}</span></td>
            <td class="mono" style="font-size:11px;color:var(--tx-lo)">${P.min}–${P.max}</td>
            <td>${medBadge(st)}</td>
            <td class="mono" style="font-size:11.5px;color:var(--ac)">${esc(m.p.codigo)}</td>
            <td>${esc(areaName(m.p.areaId))}</td>
            <td>${esc(emp(m.byId)?.nome.split(' ').slice(0, 2).join(' ') ?? 'Sistema')}</td>
            <td class="right mono" style="font-size:11.5px">${esc(dtFull(m.ts))}</td>
          </tr>`;
        }).join('')}</tbody></table>` : empty('Nenhuma medição registrada', '', 'gauge')}
    </div>
  </section>`;
}

/* ------------------------------------------------------------ */
function mount(root) {
  const page = root.querySelector('.page');
  if (!page) return null;

  const repaint = () => {
    if (document.querySelector('.overlay')) return;
    const view = document.querySelector('#view');
    const scroll = document.querySelector('#main')?.scrollTop ?? 0;
    view.innerHTML = render();
    mount(view);
    const m = document.querySelector('#main'); if (m) m.scrollTop = scroll;
  };

  $('#md-area', root)?.addEventListener('change', (e) => { f.area = e.target.value; f.foco = null; repaint(); });
  $('#md-param', root)?.addEventListener('change', (e) => { f.param = e.target.value; f.foco = null; repaint(); });
  on(page, 'click', '[data-focus]', (e, t) => { f.foco = t.dataset.focus; repaint(); });
  on(page, 'click', '[data-pet]', (e, t) => { location.hash = `#/pets/${t.dataset.pet}`; });

  $('#md-export', root)?.addEventListener('click', () => {
    const rows = Object.values(state.sensors).flatMap((s) => s.serie.slice(-30).map((d) => ({ s, d })));
    downloadText(`medicoes-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows, [
      { label: 'Data/hora', get: (r) => dtFull(r.d.ts) },
      { label: 'Área', get: (r) => areaName(r.s.areaId) },
      { label: 'Parâmetro', get: (r) => PARAMS[r.s.param].nome },
      { label: 'Valor', get: (r) => String(r.d.v).replace('.', ',') },
      { label: 'Unidade', get: (r) => PARAMS[r.s.param].unidade },
      { label: 'Limite mín.', get: (r) => PARAMS[r.s.param].min },
      { label: 'Limite máx.', get: (r) => PARAMS[r.s.param].max },
      { label: 'Situação', get: (r) => STATUS_MEDICAO[classify(r.s.param, r.d.v)].label },
    ])).then((ok) => {
      if (ok) toast('Exportação concluída', `${rows.length} leituras exportadas.`, 'ok');
    });
  });

  const t = setInterval(() => {
    if (!location.hash.includes('medicoes')) return;
    repaint();
  }, 6000);
  return () => clearInterval(t);
}

return { render, mount };
})();

/* ---------- src/screens/alertas.js ---------- */
const M_screens_alertas = (() => {
/**
 * PET CONTROL — Central de alertas.
 */

const { esc, dtFull, ago, matches, on, $, debounce, toCSV, downloadText } = M_util;
const { icon } = M_ui_icons;
const { panel, kpi, empty, sevBadge, searchBox, selectBox } = M_ui_kit;
const { barChart, TONE } = M_ui_charts;
const { toast, confirm } = M_ui_overlay;
const { state, emp, pet, allow, ackAlert, resolveAlert, me } = M_store;
const { alertsInScope, seriePorDia } = M_selectors;
const { ALERTA_TIPOS, SEV, areaName, unitName } = M_data_catalog;
const f = { q: '', sev: 'TODAS', status: 'ABERTOS', tipo: 'TODOS' };

function render() {
  const all = alertsInScope();
  const rows = filtered();
  const abertos = all.filter((a) => a.status !== 'RESOLVIDO');
  const serie = seriePorDia(14, { unidade: state.ui.unidade });

  return `<div class="page">
    <div class="page-hd">
      <div>
        <div class="crumbs">${icon('alert')} Monitoramento ${icon('chevR')} Alertas</div>
        <h1>Central de alertas</h1>
        <p class="lead">Ocorrências geradas automaticamente por acessos negados, medições fora do parâmetro, permissões vencendo e pendências cadastrais.</p>
      </div>
      <div class="acts">
        <button class="btn btn-outline" id="al-export">${icon('download')} Exportar</button>
        ${allow('alert.ack') && abertos.length ? `<button class="btn btn-primary" id="al-all">${icon('checks')} Tratar todos</button>` : ''}
      </div>
    </div>

    <div class="grid g-kpi" style="margin-bottom:16px">
      ${kpi({ label: 'Em aberto', value: String(abertos.length).padStart(2, '0'), ico: 'alert', color: abertos.length ? 'var(--warn)' : 'var(--ok)', foot: '<span>aguardando tratativa</span>' })}
      ${kpi({ label: 'Críticos', value: String(abertos.filter((a) => a.sev === 'risk').length).padStart(2, '0'), ico: 'xCircle', color: 'var(--risk)', foot: '<span>ação imediata</span>' })}
      ${kpi({ label: 'Atenção', value: String(abertos.filter((a) => a.sev === 'warn').length).padStart(2, '0'), ico: 'warnCircle', color: 'var(--warn)', foot: '<span>monitorar condição</span>' })}
      ${kpi({ label: 'Resolvidos (30d)', value: all.filter((a) => a.status === 'RESOLVIDO').length, ico: 'okCircle', color: 'var(--ok)', foot: '<span>tratativas concluídas</span>' })}
    </div>

    <div class="grid g-side" style="align-items:start">
      <section class="panel">
        <div class="toolbar">
          ${searchBox('al-q', 'Buscar por título, descrição, área ou PET…', f.q)}
          ${selectBox('al-status', [{ value: 'ABERTOS', label: 'Em aberto' }, { value: 'TODOS', label: 'Todos' }, { value: 'RESOLVIDO', label: 'Resolvidos' }], f.status)}
          ${selectBox('al-sev', [{ value: 'TODAS', label: 'Todas as severidades' }, { value: 'risk', label: 'Crítico' }, { value: 'warn', label: 'Atenção' }, { value: 'info', label: 'Informativo' }], f.sev)}
          ${selectBox('al-tipo', [{ value: 'TODOS', label: 'Todos os tipos' }, ...Object.entries(ALERTA_TIPOS).map(([k, v]) => ({ value: k, label: v.label }))], f.tipo)}
          <div class="grow"></div>
          <span class="mono" style="font-size:11px;color:var(--tx-dim)">${rows.length}</span>
        </div>
        <div class="col g-2" style="padding:14px">
          ${rows.length ? rows.slice(0, 50).map(cardHTML).join('') : empty('Nenhum alerta', 'Nenhuma ocorrência corresponde aos filtros.', 'shieldOk')}
        </div>
      </section>

      <div class="col g-4">
        ${panel({
          title: 'Ocorrências por dia',
          sub: 'Últimos 14 dias',
          body: barChart({
            h: 168,
            labels: serie.map((d) => new Date(d.ts).getDate().toString().padStart(2, '0')),
            series: [{ name: 'Alertas', data: serie.map((d) => d.alertas), color: TONE.warn }],
          }),
        })}
        ${panel({
          title: 'Distribuição por tipo',
          body: `<div class="col g-3">${Object.entries(ALERTA_TIPOS).map(([k, v]) => {
            const n = all.filter((a) => a.tipo === k).length;
            if (!n) return '';
            const tone = v.sev === 'risk' ? TONE.risk : v.sev === 'warn' ? TONE.warn : TONE.info;
            return `<div>
              <div class="row-b" style="margin-bottom:5px">
                <span class="row g-2" style="font-size:12px;color:var(--tx)">
                  <span style="color:${tone};display:flex">${icon(v.icon, 13)}</span>${esc(v.label)}</span>
                <span class="num" style="font-size:12px">${n}</span>
              </div>
              <div class="progress"><i style="width:${((n / all.length) * 100).toFixed(0)}%;background:${tone}"></i></div>
            </div>`;
          }).join('')}</div>`,
        })}
      </div>
    </div>
  </div>`;
}

function filtered() {
  return alertsInScope().filter((a) => {
    if (f.status === 'ABERTOS' && a.status === 'RESOLVIDO') return false;
    if (f.status === 'RESOLVIDO' && a.status !== 'RESOLVIDO') return false;
    if (f.sev !== 'TODAS' && a.sev !== f.sev) return false;
    if (f.tipo !== 'TODOS' && a.tipo !== f.tipo) return false;
    return matches(f.q, a.titulo, a.descricao, areaName(a.areaId), pet(a.petId)?.codigo ?? '');
  });
}

function cardHTML(a) {
  const t = ALERTA_TIPOS[a.tipo] ?? ALERTA_TIPOS.SISTEMA;
  const tone = a.sev === 'risk' ? 'risk' : a.sev === 'warn' ? 'warn' : 'info';
  const c = `var(--${tone})`;
  const p = pet(a.petId);
  const e = emp(a.empId);

            <span>${icon('clock', 11)} ${esc(dtFull(a.ts))} · ${esc(ago(a.ts))}</span>
            <span>${icon('pin', 11)} ${esc(areaName(a.areaId))} · ${esc(unitName(a.unidade))}</span>
            <span>${icon('layers', 11)} ${esc(t.label)}</span>

            ${e ? `<span>${icon('users', 11)} ${esc(e.nome)}</span>` : ''}
          </div>
          ${resolvido && a.resolvidoEm ? `<div style="font-size:11px;color:var(--tx-dim);margin-top:7px">
            Tratado por ${esc(emp(a.resolvidoPorId)?.nome ?? 'Sistema')} em ${esc(dtFull(a.resolvidoEm))}</div>` : ''}
